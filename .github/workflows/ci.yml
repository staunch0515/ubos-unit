# Build and quality gates (UBS-ARC-07 §4) for the PH-0 skeleton (DEC-030 step 1).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: specification and finance requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: regenerate and validate (regen_all.sh)
        run: bash docs/tools/regen_all.sh
      - name: generated files are committed
        run: git diff --exit-code

  typescript:
    name: typescript sdk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/sdk-ts/package-lock.json
      - name: install (locked)
        run: npm ci
      - name: type check (tsc --strict, UBS-ARC-07 §4)
        run: npm run typecheck
      - name: lint (eslint)
        run: npm run lint
      - name: build
        run: npm run build
      - name: browser core under 60 KB gzipped (DSN-SDK-017)
        run: npm run size

  sdk-suites:
    name: sdk suites
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: bpa
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/sdk-ts/package-lock.json
            packages/eng-ui/package-lock.json
      - name: build the node, forge and the Rust runner
        run: cargo build --locked -p ubos-node -p ubos-forge -p ubos-sdk --bin ubos-server --bin forge --example suite
      - name: build the TypeScript runner
        working-directory: packages/sdk-ts
        run: npm ci && npm run examples
      - name: SUITE-SDK-PROTO, SUITE-SDK-NET and SUITE-SDK-TYPES, both SDKs over HTTP and WebSocket (EXIT-1-15)
        run: |
          python3 verify/sdk/sdk_suite.py --server target/debug/ubos-server --forge target/debug/forge \
            --rust target/debug/examples/suite --ts packages/sdk-ts/build/suite/suite.js \
            --database "host=127.0.0.1 user=postgres dbname=bpa" --report sdk-suite.json
      - name: the engineering UI — type check, lint, build, and the walk-through in Chrome over both bindings (PH-1b acceptance UI)
        working-directory: packages/eng-ui
        run: |
          npm ci && npm run check
          for b in ws http; do
            node test/e2e.mjs --forge ../../target/debug/forge --server ../../target/debug/ubos-server \
              --binding $b --chromium "$(command -v google-chrome || command -v chromium)"
          done
      - name: forge dev on PostgreSQL — install, two script edits, a model change (DSN-FRG-501; debug build, so the bound is 60 s, not NR-PERF-016's 10 s)
        run: |
          python3 verify/tools/dev_loop.py --forge target/debug/forge --server target/debug/ubos-server \
            --database "host=127.0.0.1 user=postgres dbname=bpa" --edits 2 --target-ms 60000

  scenarios-ubtp:
    name: scenarios over UBTP
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: bpa
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - name: build the node and forge
        run: cargo build --locked -p ubos-node -p ubos-forge --bin ubos-server --bin forge
      - name: the scenario tests over UBTP on a dev-preset Server, WebSocket and HTTP (EXIT-1-19)
        run: |
          for b in ws http; do
            target/debug/forge test verify/scenarios --backend ubtp --server target/debug/ubos-server \
              --database "host=127.0.0.1 user=postgres dbname=bpa" --binding $b --report scenarios-ubtp-$b.json
          done
      - name: SCN-001 and SCN-017, the operator scenarios on an installed Server (EXIT-1-19)
        run: |
          python3 verify/scenarios/server/scn_server.py --binary target/debug/ubos-server \
            --pg-bin /usr/lib/postgresql/16/bin --report scenarios-server.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exit-1-19-reports
          path: scenarios-*.json

  rust:
    name: rust workspace
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: bpa
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - name: format
        run: cargo fmt --all --check
      - name: lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: dependency graph (AR-031, DEC-028)
        run: python3 docs/tools/check_deps.py
      - name: the SDK error registries (Rust and TypeScript) are generated from STD-ERR-002 (DSN-SDK-007)
        run: python3 crates/ubos-sdk/tools/gen_registry.py --check
      - name: test bodies of the mutation score — vectors, scenarios and property sample (VER-INSP-0001, DEC-061)
        run: cargo test -p ubos-forge -p ubos-dvm --locked
        env:
          UBOS_TEST_DATABASE: "host=127.0.0.1 user=postgres dbname=bpa"
      - name: node suites — UBTP over every binding and local identity (SUITE-NOD-PROTO, SUITE-NOD-AUTH, VER-CONF-7000, EXIT-1-15)
        run: cargo test -p ubos-node --locked
        env:
          UBOS_TEST_DATABASE: "host=127.0.0.1 user=postgres dbname=bpa"
      - name: BPA 0.1 vectors tagged prototype (EXIT-0-03, DEC-033)
        run: |
          cargo build --release --locked -p ubos-forge
          ./target/release/forge conform --vectors standard/vectors --tag prototype --verbose
          ./target/release/forge conform --vectors standard/vectors --tag prototype --verbose \
            --backend postgres --database "host=127.0.0.1 user=postgres dbname=bpa"
      - name: storage suite on PostgreSQL (SUITE-DVM-STORE, VER-CONF-8402, EXIT-1-03)
        run: |
          cargo build --release --locked -p ubos-dvm --bin ubos-store-suite
          ./target/release/ubos-store-suite --appends 1000 \
            --database "host=127.0.0.1 user=postgres dbname=bpa" > /dev/null
      - name: property checks, 10,000 cases each (SUITE-DVM-PROP, DEC-033)
        run: |
          cargo build --release --locked -p ubos-dvm --bin ubos-props
          ./target/release/ubos-props --cases 10000
      - name: benchmark tools, small dataset (VER-BENCH-0001 and VER-BENCH-0100 drivers, PH-0 step 5c, PH-1 step 9a)
        run: |
          cargo build --release --locked -p ubos-dvm --bin ubos-bench
          DB="host=127.0.0.1 user=postgres dbname=bpa"
          ./target/release/ubos-bench check --objects 300 --months 4 --database "$DB" > /dev/null
          for w in read commit diff branch asof; do
            ./target/release/ubos-bench run --what $w --objects 300 --months 4 --seconds 3 \
              --rate 50 --workers 2 --database "$DB" > /dev/null
          done
          ./target/release/ubos-bench run --what merge --objects 300 --months 4 --seconds 3 \
            --rate 2 --database "$DB" > /dev/null
          ./target/release/ubos-bench run --what read --objects 300 --months 4 --seconds 3 \
            --rate 50 --workers 2 --background 10 --database "$DB" > /dev/null
      - name: L2 escape suite, all cases blocked (VER-SEC-0100, EXIT-1-10, DEC-058)
        run: |
          cargo build --release --locked -p ubos-dvm --bin ubos-l2-suite
          ./target/release/ubos-l2-suite --cases verify/sandbox/l2-escape-cases.json
      - name: forge init, check, types and test on the skeleton (DSN-FRG-002, -101, -102, -201…204, DEC-060)
        run: |
          cargo build --release --locked -p ubos-forge
          rm -rf /tmp/forge-skeleton
          ./target/release/forge init /tmp/forge-skeleton --name skeleton
          ./target/release/forge check /tmp/forge-skeleton --json > /dev/null
          ./target/release/forge types /tmp/forge-skeleton --json > /dev/null
          ./target/release/forge test /tmp/forge-skeleton --junit /tmp/forge-skeleton/junit.xml --report /tmp/forge-skeleton/report.json
      - name: gate-1a scenarios in memory and on PostgreSQL (VER-SCN-1000, EXIT-1-13, DEC-060)
        run: |
          ./target/release/forge check verify/scenarios
          ./target/release/forge test verify/scenarios
          ./target/release/forge test verify/scenarios --backend postgres --database "host=127.0.0.1 user=postgres dbname=bpa"
      - name: concurrency and crash simulation, 2,000 seeds (SUITE-DVM-SIM, VER-SIM-0001, DEC-061)
        run: |
          cargo build --release --locked -p ubos-dvm --bin ubos-sim
          ./target/release/ubos-sim --seeds 2000 --threads 2
      - name: durability under SIGKILL on PostgreSQL, 40 events (SUITE-DVM-FAULT, VER-FAULT-0001, DEC-061)
        run: |
          cargo build --release --locked -p ubos-dvm --bin ubos-fault
          ./target/release/ubos-fault --database "host=127.0.0.1 user=postgres dbname=bpa" --events 40 --workers 3 --verify-every 10
      - name: replay corpus on Linux x86-64 (SUITE-DVM-REPLAY, VER-CONF-8500, DEC-061)
        run: |
          cargo build --release --locked -p ubos-dvm --bin ubos-replay
          ./target/release/ubos-replay check --expected verify/replay/expected.json
      - name: host services on PostgreSQL (SUITE-NOD-HOST, DEC-060)
        run: |
          cargo build --release --locked -p ubos-node --bin ubos-node-suite
          ./target/release/ubos-node-suite --database "host=127.0.0.1 user=postgres dbname=bpa"
      - name: embedded genesis Buks verify (DSN-NOD-420, DEC-077)
        run: |
          cargo build --release --locked -p ubos-node --bin ubos-server
          ./target/release/ubos-server genesis-verify
      - name: events and jobs on PostgreSQL (SUITE-NOD-EVENTS, SUITE-NOD-JOBS, DEC-076)
        run: |
          cargo build --release --locked -p ubos-node --bin ubos-events-suite
          ./target/release/ubos-events-suite --suite events --database "host=127.0.0.1 user=postgres dbname=bpa"
          ./target/release/ubos-events-suite --suite jobs --database "host=127.0.0.1 user=postgres dbname=bpa"
      - name: export/import round trip with the independent verifier (VER-CONF-8403, EXIT-1-12, DEC-059)
        run: |
          cargo build --release --locked -p ubos-verify
          cargo build --release --locked -p ubos-dvm --bin ubos-roundtrip
          ./target/release/ubos-roundtrip --database "host=127.0.0.1 user=postgres dbname=bpa" \
            --vaes 2 --objects 60 --entries 60 --months 2 --verifier ./target/release/ubos-verify

  models:
    name: formal models (reduced bounds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: model-check commit_cas, merge, timeline, group_commit (VER-FORM-0001..0004)
        run: sh verify/models/check.sh ci
