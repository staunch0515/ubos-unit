# Build and quality gates (UBS-ARC-07 §4) for the PH-0 skeleton (DEC-030 step 1).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: specification and finance requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: regenerate and validate (regen_all.sh)
        run: bash docs/tools/regen_all.sh
      - name: generated files are committed
        run: git diff --exit-code

  rust:
    name: rust workspace
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: bpa
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - name: format
        run: cargo fmt --all --check
      - name: lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: dependency graph (AR-031, DEC-028)
        run: python3 docs/tools/check_deps.py
      - name: BPA 0.1 vectors tagged prototype (EXIT-0-03, DEC-033)
        run: |
          cargo build --release --locked -p ubos-forge
          ./target/release/forge conform --vectors standard/vectors --tag prototype --verbose
          ./target/release/forge conform --vectors standard/vectors --tag prototype --verbose \
            --backend postgres --database "host=127.0.0.1 user=postgres dbname=bpa"
      - name: property checks, 10,000 cases each (SUITE-DVM-PROP, DEC-033)
        run: |
          cargo build --release --locked -p ubos-dvm --bin ubos-props
          ./target/release/ubos-props --cases 10000
      - name: benchmark tools, small dataset (VER-BENCH-0001 driver, PH-0 step 5c)
        run: |
          cargo build --release --locked -p ubos-dvm --bin ubos-bench
          DB="host=127.0.0.1 user=postgres dbname=bpa"
          ./target/release/ubos-bench check --objects 300 --months 4 --database "$DB" > /dev/null
          for w in read commit diff; do
            ./target/release/ubos-bench run --what $w --objects 300 --months 4 --seconds 3 \
              --rate 50 --workers 2 --database "$DB" > /dev/null
          done
      - name: L2 escape suite, 100 of 100 blocked (VER-SEC-0001, DEC-034)
        run: |
          cargo build --release --locked -p ubos-runtime
          ./target/release/ubos-sandbox-spike --cases verify/sandbox/l2-escape-cases.json

  models:
    name: formal models (reduced bounds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: model-check commit_cas, merge, timeline (VER-FORM-0001..0003)
        run: sh verify/models/check.sh ci
