# Cargo workspace of the UBOS reference implementation (UBS-ARC-07 §2, DEC-028).
# Only the PH-0 prototype crates exist so far (UBS-PH-0 §2, DEC-033).
[workspace]
resolver = "2"
members = [
    "crates/ubos-types",
    "crates/ubos-store",
    "crates/ubos-tree",
    "crates/ubos-version",
    "crates/ubos-time",
    "crates/ubos-dvm",
    "crates/ubos-forge",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-only"
repository = "https://github.com/staunch0515/ubos-unit"
publish = false

[workspace.dependencies]
ubos-types = { path = "crates/ubos-types" }
ubos-store = { path = "crates/ubos-store" }
ubos-tree = { path = "crates/ubos-tree" }
ubos-version = { path = "crates/ubos-version" }
ubos-time = { path = "crates/ubos-time" }
ubos-dvm = { path = "crates/ubos-dvm" }
# third-party crates of the PH-0 prototype (DEC-033)
serde = "1"
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
regex = "1"
ed25519-dalek = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
