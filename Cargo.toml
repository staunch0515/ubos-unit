# Cargo workspace of the UBOS reference implementation (UBS-ARC-07 §2, DEC-028).
# Only the PH-0 prototype crates exist so far (UBS-PH-0 §2, DEC-033).
[workspace]
resolver = "2"
members = [
    "crates/ubos-types",
    "crates/ubos-crypto",
    "crates/ubos-store",
    "crates/ubos-tree",
    "crates/ubos-version",
    "crates/ubos-proof",
    "crates/ubos-time",
    "crates/ubos-model",
    "crates/ubos-expr",
    "crates/ubos-rules",
    "crates/ubos-flow",
    "crates/ubos-query",
    "crates/ubos-runtime",
    "crates/ubos-dvm",
    "crates/ubos-node",
    "crates/ubos-forge",
    "verify/ubos-verify",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-only"
repository = "https://github.com/staunch0515/ubos-unit"
publish = false

[workspace.dependencies]
ubos-types = { path = "crates/ubos-types" }
ubos-crypto = { path = "crates/ubos-crypto" }
ubos-store = { path = "crates/ubos-store" }
ubos-tree = { path = "crates/ubos-tree" }
ubos-version = { path = "crates/ubos-version" }
ubos-proof = { path = "crates/ubos-proof" }
ubos-verify = { path = "verify/ubos-verify" }
ubos-node = { path = "crates/ubos-node" }
ubos-time = { path = "crates/ubos-time" }
ubos-dvm = { path = "crates/ubos-dvm" }
ubos-model = { path = "crates/ubos-model" }
ubos-expr = { path = "crates/ubos-expr" }
ubos-rules = { path = "crates/ubos-rules" }
ubos-flow = { path = "crates/ubos-flow" }
ubos-query = { path = "crates/ubos-query" }
ubos-runtime = { path = "crates/ubos-runtime" }
# third-party crates of the PH-0 prototype (DEC-033)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
regex = "1"
ed25519-dalek = "2"
# Rhai for the L2 sandbox spike (STD-CTX-020, DSN-DVM-612); floats off, exact decimals on
rhai = { version = "1", default-features = false, features = ["std", "no_float", "no_time", "no_module", "no_closure", "no_custom_syntax"] }
# counting allocator: memory probe of the sandbox spike binary
cpu-time = "1"
cap = "0.1"
# kernel storage on PostgreSQL (DEC-007, DEC-047)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
tokio = { version = "1", features = ["rt"] }
# physical form of stored bytes: zstd, then XChaCha20-Poly1305 (DSN-DVM-002, DEC-048)
zstd = { version = "0.13", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
getrandom = "0.2"
# Forge project sources (DSN-FRG-002): YAML sources and the TOML manifest
serde_yaml_ng = "0.10"
toml = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
