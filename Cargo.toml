# Cargo workspace of the UBOS reference implementation (UBS-ARC-07 §2, DEC-028).
# Only the PH-0 prototype crates exist so far (UBS-PH-0 §2, DEC-033).
[workspace]
resolver = "2"
members = [
    "crates/ubos-types",
    "crates/ubos-crypto",
    "crates/ubos-store",
    "crates/ubos-tree",
    "crates/ubos-version",
    "crates/ubos-proof",
    "crates/ubos-time",
    "crates/ubos-model",
    "crates/ubos-expr",
    "crates/ubos-rules",
    "crates/ubos-flow",
    "crates/ubos-query",
    "crates/ubos-authz",
    "crates/ubos-runtime",
    "crates/ubos-proto",
    "crates/ubos-dvm",
    "crates/ubos-node",
    "crates/ubos-forge",
    "crates/ubos-sdk",
    "verify/ubos-verify",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-only"
repository = "https://github.com/staunch0515/ubos-unit"
publish = false

[workspace.dependencies]
ubos-types = { path = "crates/ubos-types" }
ubos-crypto = { path = "crates/ubos-crypto" }
ubos-store = { path = "crates/ubos-store" }
ubos-tree = { path = "crates/ubos-tree" }
ubos-version = { path = "crates/ubos-version" }
ubos-proof = { path = "crates/ubos-proof" }
ubos-verify = { path = "verify/ubos-verify" }
ubos-node = { path = "crates/ubos-node" }
ubos-time = { path = "crates/ubos-time" }
ubos-dvm = { path = "crates/ubos-dvm" }
ubos-model = { path = "crates/ubos-model" }
ubos-expr = { path = "crates/ubos-expr" }
ubos-rules = { path = "crates/ubos-rules" }
ubos-flow = { path = "crates/ubos-flow" }
ubos-query = { path = "crates/ubos-query" }
ubos-authz = { path = "crates/ubos-authz" }
ubos-runtime = { path = "crates/ubos-runtime" }
ubos-proto = { path = "crates/ubos-proto" }
ubos-sdk = { path = "crates/ubos-sdk" }
# third-party crates of the PH-0 prototype (DEC-033)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
regex = "1"
ed25519-dalek = "2"
# Rhai for the L2 sandbox spike (STD-CTX-020, DSN-DVM-612); floats off, exact decimals on
rhai = { version = "1", default-features = false, features = ["std", "no_float", "no_time", "no_module", "no_closure", "no_custom_syntax"] }
# counting allocator: memory probe of the sandbox spike binary
cpu-time = "1"
cap = "0.1"
# kernel storage on PostgreSQL (DEC-007, DEC-047)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# physical form of stored bytes: zstd, then XChaCha20-Poly1305 (DSN-DVM-002, DEC-048)
zstd = { version = "0.13", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
getrandom = "0.2"
# local identity of the node (DSN-NOD-101, DEC-075 14c): Argon2id password hashes and
# HMAC-SHA1 for TOTP (RFC 6238)
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
sha1 = "0.10"
hmac = "0.12"
# the policy engine of ubos-authz (DEC-021, DEC-065): the Cedar reference implementation
cedar-policy = "4.13"
# Forge project sources (DSN-FRG-002): YAML sources and the TOML manifest
serde_yaml_ng = "0.10"
toml = "0.8"
fastcdc = "5"
hyper = { version = "1", features = ["client", "http1"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }
bytes = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"

# Argon2id at 64 MiB and 3 iterations (DSN-NOD-101) is optimised even in debug builds, so
# that a sign-in on a development build takes well under a second
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
