# Unique keys and slugs at commit and at merge — STD-CLS-001 `keys`, STD-ISA-010, STD-VER-050 (DSN-DVM-111, FR-MODEL-013; PH-2 steps 0b-3, 0b-4)
tests:
  - {"name": "KEY-1: a second object with the same key is refused; another value commits", "kind": "scenario", "steps": [{"op": "commit", "input": {"branch": "main", "changes": [{"op": "create", "class": "Supplier", "object_id": "01890a5d-ac96-7014-8000-000000000001", "slug": "s-1", "body": {"name": "s-1", "tax_id": "T1"}}]}, "expect": {"match": "subset", "result": {}}}, {"op": "commit", "input": {"branch": "main", "changes": [{"op": "create", "class": "Supplier", "object_id": "01890a5d-ac96-7014-8000-000000000002", "slug": "s-2", "body": {"name": "s-2", "tax_id": "T1"}}]}, "expect": {"error_code": "MODEL.KEY_CONFLICT", "details": {"class": "Supplier", "fields": ["tax_id"]}}}, {"op": "commit", "input": {"branch": "main", "changes": [{"op": "create", "class": "Supplier", "object_id": "01890a5d-ac96-7014-8000-000000000002", "slug": "s-2", "body": {"name": "s-2", "tax_id": "T2"}}]}, "expect": {"match": "subset", "result": {}}}]}
  - {"name": "KEY-2: an update that takes another object's key is refused", "kind": "scenario", "steps": [{"op": "commit", "input": {"branch": "main", "changes": [{"op": "create", "class": "Supplier", "object_id": "01890a5d-ac96-7014-8000-000000000001", "slug": "s-1", "body": {"name": "s-1", "tax_id": "T1"}}, {"op": "create", "class": "Supplier", "object_id": "01890a5d-ac96-7014-8000-000000000002", "slug": "s-2", "body": {"name": "s-2", "tax_id": "T2"}}]}, "expect": {"match": "subset", "result": {}}}, {"op": "read", "input": {"branch": "main", "object_id": "01890a5d-ac96-7014-8000-000000000002"}, "expect": {"match": "subset", "result": {}}, "label": "v2"}, {"op": "commit", "input": {"branch": "main", "changes": [{"op": "update", "object_id": "01890a5d-ac96-7014-8000-000000000002", "base": {"$ref": "v2/version_hash"}, "body": {"name": "s-2", "tax_id": "T1"}}]}, "expect": {"error_code": "MODEL.KEY_CONFLICT"}}]}
  - {"name": "KEY-3: a key declared on a class holds across its subclasses", "kind": "scenario", "steps": [{"op": "commit", "input": {"branch": "main", "changes": [{"op": "create", "class": "Supplier", "object_id": "01890a5d-ac96-7014-8000-000000000001", "slug": "s-1", "body": {"name": "s-1", "tax_id": "T1"}}]}, "expect": {"match": "subset", "result": {}}}, {"op": "commit", "input": {"branch": "main", "changes": [{"op": "create", "class": "PreferredSupplier", "object_id": "01890a5d-ac96-7014-8000-000000000003", "slug": "p-1", "body": {"name": "p-1", "tax_id": "T1", "tier": "gold"}}]}, "expect": {"error_code": "MODEL.KEY_CONFLICT"}}]}
  - {"name": "KEY-4: two objects of one commit with the same key are refused; an absent key field constrains nothing", "kind": "scenario", "steps": [{"op": "commit", "input": {"branch": "main", "changes": [{"op": "create", "class": "Supplier", "object_id": "01890a5d-ac96-7014-8000-000000000001", "slug": "s-1", "body": {"name": "s-1", "tax_id": "T1"}}, {"op": "create", "class": "Supplier", "object_id": "01890a5d-ac96-7014-8000-000000000002", "slug": "s-2", "body": {"name": "s-2", "tax_id": "T1"}}]}, "expect": {"error_code": "MODEL.KEY_CONFLICT"}}, {"op": "commit", "input": {"branch": "main", "changes": [{"op": "create", "class": "Supplier", "object_id": "01890a5d-ac96-7014-8000-000000000001", "slug": "s-1", "body": {"name": "s-1"}}, {"op": "create", "class": "Supplier", "object_id": "01890a5d-ac96-7014-8000-000000000002", "slug": "s-2", "body": {"name": "s-2"}}]}, "expect": {"match": "subset", "result": {}}}]}
  - {"name": "KEY-5: a composite key compares all its fields", "kind": "scenario", "steps": [{"op": "commit", "input": {"branch": "main", "changes": [{"op": "create", "class": "Supplier", "object_id": "01890a5d-ac96-7014-8000-000000000001", "slug": "s-1", "body": {"name": "s-1", "country": "US", "code": "A"}}, {"op": "create", "class": "Supplier", "object_id": "01890a5d-ac96-7014-8000-000000000002", "slug": "s-2", "body": {"name": "s-2", "country": "US", "code": "B"}}, {"op": "create", "class": "Supplier", "object_id": "01890a5d-ac96-7014-8000-000000000003", "slug": "s-3", "body": {"name": "s-3", "country": "DE", "code": "A"}}]}, "expect": {"match": "subset", "result": {}}}, {"op": "commit", "input": {"branch": "main", "changes": [{"op": "create", "class": "Supplier", "object_id": "01890a5d-ac96-7014-8000-000000000004", "slug": "s-4", "body": {"name": "s-4", "country": "US", "code": "A"}}]}, "expect": {"error_code": "MODEL.KEY_CONFLICT", "details": {"class": "Supplier", "fields": ["country", "code"]}}}]}
  - {"name": "KEY-6: an ended object releases its key", "kind": "scenario", "steps": [{"op": "commit", "input": {"branch": "main", "changes": [{"op": "create", "class": "Supplier", "object_id": "01890a5d-ac96-7014-8000-000000000001", "slug": "s-1", "body": {"name": "s-1", "tax_id": "T1"}}]}, "expect": {"match": "subset", "result": {}}}, {"op": "read", "input": {"branch": "main", "object_id": "01890a5d-ac96-7014-8000-000000000001"}, "expect": {"match": "subset", "result": {}}, "label": "v1"}, {"op": "commit", "input": {"branch": "main", "changes": [{"op": "end", "object_id": "01890a5d-ac96-7014-8000-000000000001", "base": {"$ref": "v1/version_hash"}}]}, "expect": {"match": "subset", "result": {}}}, {"op": "commit", "input": {"branch": "main", "changes": [{"op": "create", "class": "Supplier", "object_id": "01890a5d-ac96-7014-8000-000000000005", "slug": "s-5", "body": {"name": "s-5", "tax_id": "T1"}}]}, "expect": {"match": "subset", "result": {}}}]}
  - {"name": "SLUG-1: a second object of the class with the same slug is refused; another class may use it", "kind": "scenario", "steps": [{"op": "commit", "input": {"branch": "main", "changes": [{"op": "create", "class": "Supplier", "object_id": "01890a5d-ac96-7014-8000-000000000001", "slug": "s-1", "body": {"name": "s-1"}}]}, "expect": {"match": "subset", "result": {}}}, {"op": "commit", "input": {"branch": "main", "changes": [{"op": "create", "class": "Supplier", "object_id": "01890a5d-ac96-7014-8000-000000000002", "slug": "s-1", "body": {"name": "s-1"}}]}, "expect": {"error_code": "MODEL.KEY_CONFLICT", "details": {"class": "Supplier", "slug": "s-1"}}}, {"op": "commit", "input": {"branch": "main", "changes": [{"op": "create", "class": "Customer", "object_id": "01890a5d-ac96-7014-8000-000000000002", "slug": "s-1", "body": {"name": "c"}}]}, "expect": {"match": "subset", "result": {}}}, {"op": "commit", "input": {"branch": "main", "changes": [{"op": "create", "class": "PreferredSupplier", "object_id": "01890a5d-ac96-7014-8000-000000000003", "slug": "s-1", "body": {"name": "s-1"}}]}, "expect": {"match": "subset", "result": {}}}]}
  - {"name": "SLUG-2: a slug change onto a taken slug is refused; onto a free one it commits", "kind": "scenario", "steps": [{"op": "commit", "input": {"branch": "main", "changes": [{"op": "create", "class": "Supplier", "object_id": "01890a5d-ac96-7014-8000-000000000001", "slug": "s-1", "body": {"name": "s-1"}}, {"op": "create", "class": "Supplier", "object_id": "01890a5d-ac96-7014-8000-000000000002", "slug": "s-2", "body": {"name": "s-2"}}]}, "expect": {"match": "subset", "result": {}}}, {"op": "read", "input": {"branch": "main", "object_id": "01890a5d-ac96-7014-8000-000000000002"}, "expect": {"match": "subset", "result": {}}, "label": "v2"}, {"op": "commit", "input": {"branch": "main", "changes": [{"op": "update", "object_id": "01890a5d-ac96-7014-8000-000000000002", "base": {"$ref": "v2/version_hash"}, "slug": "s-1", "body": {"name": "s-2"}}]}, "expect": {"error_code": "MODEL.KEY_CONFLICT", "details": {"slug": "s-1"}}}, {"op": "commit", "input": {"branch": "main", "changes": [{"op": "update", "object_id": "01890a5d-ac96-7014-8000-000000000002", "base": {"$ref": "v2/version_hash"}, "slug": "s-9", "body": {"name": "s-2"}}]}, "expect": {"match": "subset", "result": {}}}]}
  - {"name": "SLUG-3: two objects of one commit with the same slug are refused; an ended object keeps its slug", "kind": "scenario", "steps": [{"op": "commit", "input": {"branch": "main", "changes": [{"op": "create", "class": "Supplier", "object_id": "01890a5d-ac96-7014-8000-000000000001", "slug": "s-1", "body": {"name": "s-1"}}, {"op": "create", "class": "Supplier", "object_id": "01890a5d-ac96-7014-8000-000000000002", "slug": "s-1", "body": {"name": "s-1"}}]}, "expect": {"error_code": "MODEL.KEY_CONFLICT"}}, {"op": "commit", "input": {"branch": "main", "changes": [{"op": "create", "class": "Supplier", "object_id": "01890a5d-ac96-7014-8000-000000000001", "slug": "s-1", "body": {"name": "s-1"}}]}, "expect": {"match": "subset", "result": {}}}, {"op": "read", "input": {"branch": "main", "object_id": "01890a5d-ac96-7014-8000-000000000001"}, "expect": {"match": "subset", "result": {}}, "label": "v1"}, {"op": "commit", "input": {"branch": "main", "changes": [{"op": "end", "object_id": "01890a5d-ac96-7014-8000-000000000001", "base": {"$ref": "v1/version_hash"}}]}, "expect": {"match": "subset", "result": {}}}, {"op": "commit", "input": {"branch": "main", "changes": [{"op": "create", "class": "Supplier", "object_id": "01890a5d-ac96-7014-8000-000000000002", "slug": "s-1", "body": {"name": "s-1"}}]}, "expect": {"error_code": "MODEL.KEY_CONFLICT", "details": {"slug": "s-1"}}}]}
  - {"name": "MKEY-1: the same key on two draft branches commits on each; the second merge is a key conflict", "kind": "scenario", "steps": [{"op": "create_branch", "input": {"name": "draft/a", "from": "main"}, "expect": {"match": "subset", "result": {}}}, {"op": "create_branch", "input": {"name": "draft/b", "from": "main"}, "expect": {"match": "subset", "result": {}}}, {"op": "commit", "input": {"branch": "draft/a", "changes": [{"op": "create", "class": "Supplier", "object_id": "01890a5d-ac96-7014-8000-000000000001", "slug": "s-a", "body": {"name": "s-a", "tax_id": "T1"}}]}, "expect": {"match": "subset", "result": {}}}, {"op": "commit", "input": {"branch": "draft/b", "changes": [{"op": "create", "class": "Supplier", "object_id": "01890a5d-ac96-7014-8000-000000000002", "slug": "s-b", "body": {"name": "s-b", "tax_id": "T1"}}]}, "expect": {"match": "subset", "result": {}}}, {"op": "merge", "input": {"source": "draft/a", "target": "main"}, "expect": {"match": "subset", "result": {"merged": true}}}, {"op": "merge_preview", "input": {"source": "draft/b", "target": "main"}, "expect": {"match": "subset", "result": {"conflicts": [{"kind": "key", "object_id": "01890a5d-ac96-7014-8000-000000000002", "with": "01890a5d-ac96-7014-8000-000000000001", "class": "Supplier", "fields": ["tax_id"]}]}}}, {"op": "merge", "input": {"source": "draft/b", "target": "main"}, "expect": {"error_code": "VER.MERGE_CONFLICT", "details": {"conflicts": [{"kind": "key", "object_id": "01890a5d-ac96-7014-8000-000000000002", "with": "01890a5d-ac96-7014-8000-000000000001"}]}}}, {"op": "read", "input": {"branch": "main", "object_id": "01890a5d-ac96-7014-8000-000000000002"}, "expect": {"error_code": "IAM.NOT_FOUND"}}]}
  - {"name": "MKEY-2: the same slug created on two branches is a key conflict at the second merge", "kind": "scenario", "steps": [{"op": "create_branch", "input": {"name": "draft/a", "from": "main"}, "expect": {"match": "subset", "result": {}}}, {"op": "create_branch", "input": {"name": "draft/b", "from": "main"}, "expect": {"match": "subset", "result": {}}}, {"op": "commit", "input": {"branch": "draft/a", "changes": [{"op": "create", "class": "Supplier", "object_id": "01890a5d-ac96-7014-8000-000000000001", "slug": "s-x", "body": {"name": "s-x"}}]}, "expect": {"match": "subset", "result": {}}}, {"op": "commit", "input": {"branch": "draft/b", "changes": [{"op": "create", "class": "Supplier", "object_id": "01890a5d-ac96-7014-8000-000000000002", "slug": "s-x", "body": {"name": "s-x"}}]}, "expect": {"match": "subset", "result": {}}}, {"op": "merge", "input": {"source": "draft/a", "target": "main"}, "expect": {"match": "subset", "result": {"merged": true}}}, {"op": "merge", "input": {"source": "draft/b", "target": "main"}, "expect": {"error_code": "VER.MERGE_CONFLICT", "details": {"conflicts": [{"kind": "key", "object_id": "01890a5d-ac96-7014-8000-000000000002", "with": "01890a5d-ac96-7014-8000-000000000001", "slug": "s-x"}]}}}]}
