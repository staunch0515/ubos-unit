# SCN-009 — Compliance officer injects a control through a governance sheet (gate 1b; FR-RULE-011, -021, -051, FR-TIME-061)
tests:
  - {"name": "SCN-009 main: a control merged as a sheet rejects a large refund without audit data and requires a signature", "kind": "scenario", "clock": "2026-03-15T10:00:00.000000Z", "steps": [{"op": "create_branch", "input": {"name": "draft/control", "from": "feature/forge"}, "expect": {"match": "subset", "result": {}}}, {"op": "commit", "input": {"branch": "draft/control", "changes": [{"op": "create", "class": "GovernanceSheet", "object_id": "01890a5d-ac96-7012-8000-000000000001", "slug": "control", "body": {"name": "acme.control", "layer": "tenant", "source": "MoneyMovement[this.amount > 10000] { audit_level: \"strict\"; require_signature: true; }", "description": "control"}}]}, "expect": {"match": "subset", "result": {}}}, {"op": "merge", "input": {"source": "draft/control", "target": "feature/forge"}, "expect": {"match": "subset", "result": {"merged": true}}, "label": "m"}, {"op": "commit", "input": {"branch": "feature/forge", "changes": [{"op": "create", "class": "Refund", "object_id": "01890a5d-ac96-7011-8000-000000000001", "slug": "rf-1", "body": {"amount": "12000", "customer": "Acme"}}]}, "expect": {"error_code": "RULE.DECLARATION_UNSATISFIED", "details": {"property": "audit_level", "object_id": "01890a5d-ac96-7011-8000-000000000001"}}}, {"op": "commit", "input": {"branch": "feature/forge", "changes": [{"op": "create", "class": "Refund", "object_id": "01890a5d-ac96-7011-8000-000000000001", "slug": "rf-1", "body": {"amount": "12000", "customer": "Acme"}}], "process": {"message": "refund of order 1001", "reason": "customer-return"}}, "expect": {"match": "subset", "result": {}}, "label": "r"}, {"op": "commit_info", "input": {"branch": "feature/forge"}, "expect": {"match": "subset", "result": {"rule_binding": {}}}}, {"op": "execute", "input": {"branch": "feature/forge", "target": "01890a5d-ac96-7011-8000-000000000001", "port": "issue", "params": {}}, "expect": {"error_code": "RULE.DECISION_REQUIRES"}}, {"op": "commit", "input": {"branch": "feature/forge", "changes": [{"op": "create", "class": "Payment", "object_id": "01890a5d-ac96-7011-8000-000000000002", "slug": "pm-1", "body": {"amount": "9000", "payee": "Beta"}}]}, "expect": {"match": "subset", "result": {}}, "label": "p"}, {"op": "execute", "input": {"branch": "feature/forge", "target": "01890a5d-ac96-7011-8000-000000000002", "port": "issue", "params": {}}, "expect": {"match": "subset", "result": {"result": "issued"}}}, {"op": "explain_cascade", "input": {"branch": "feature/forge", "object_id": "01890a5d-ac96-7011-8000-000000000001", "property": "audit_level"}, "expect": {"match": "subset", "result": {"effective": "strict", "property": "audit_level", "object": "ubos://acme/Refund/rf-1", "candidates": [{"selector": "MoneyMovement[this.amount > 10000]", "sheet": "ubos://acme/GovernanceSheet/control", "value": "strict", "won": true, "reason": "won"}]}}}, {"op": "explain_cascade", "input": {"branch": "feature/forge", "object_id": "01890a5d-ac96-7011-8000-000000000001", "property": "require_signature"}, "expect": {"match": "subset", "result": {"effective": true, "candidates": [{"selector": "MoneyMovement[this.amount > 10000]", "sheet": "ubos://acme/GovernanceSheet/control", "won": true}]}}}, {"op": "explain_cascade", "input": {"branch": "feature/forge", "object_id": "01890a5d-ac96-7011-8000-000000000002", "property": "audit_level"}, "expect": {"match": "subset", "result": {"candidates": []}}}]}
  - {"name": "SCN-009 A1: a second sheet setting audit_level with equal specificity and priority is rejected when authored", "kind": "scenario", "clock": "2026-03-15T10:00:00.000000Z", "steps": [{"op": "create_branch", "input": {"name": "draft/control", "from": "feature/forge"}, "expect": {"match": "subset", "result": {}}}, {"op": "commit", "input": {"branch": "draft/control", "changes": [{"op": "create", "class": "GovernanceSheet", "object_id": "01890a5d-ac96-7012-8000-000000000001", "slug": "control", "body": {"name": "acme.control", "layer": "tenant", "source": "MoneyMovement[this.amount > 10000] { audit_level: \"strict\"; require_signature: true; }", "description": "control"}}]}, "expect": {"match": "subset", "result": {}}}, {"op": "commit", "input": {"branch": "draft/control", "changes": [{"op": "create", "class": "GovernanceSheet", "object_id": "01890a5d-ac96-7012-8000-000000000002", "slug": "control-b", "body": {"name": "acme.control_b", "layer": "tenant", "source": "MoneyMovement[this.amount > 10000] { audit_level: \"standard\"; }", "description": "control-b"}}]}, "expect": {"error_code": "RULE.AMBIGUOUS_CASCADE", "details": {"property": "audit_level"}}}, {"op": "merge", "input": {"source": "draft/control", "target": "feature/forge"}, "expect": {"match": "subset", "result": {"merged": true}}}]}
