  - {"name": "SCN-005 A1: 100 concurrent writers on one base version, exactly one succeeds", "kind": "scenario", "clock": "2026-03-15T10:00:00.000000Z", "steps": [{"op": "read", "input": {"branch": "main", "object_id": "01890a5d-ac96-7003-8000-000000000001"}, "expect": {"match": "subset", "result": {}}, "label": "v"}, {"op": "commit", "input": {"branch": "main", "changes": [{"op": "update", "object_id": "01890a5d-ac96-7003-8000-000000000001", "base": {"$ref": "v/version_hash"}, "body": {"email": "race@acme.example"}}]}, "expect": {"match": "subset", "result": {"ok": 1, "errors": {"TXN.HEAD_MOVED": 99}}}, "concurrent": 100}, {"op": "read", "input": {"branch": "main", "object_id": "01890a5d-ac96-7003-8000-000000000001"}, "expect": {"match": "subset", "result": {"body": {"email": "race@acme.example"}}}}]}
