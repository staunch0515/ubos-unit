# Privacy by default in PH-1 — classification by declaration, raise-only, rectification (DSN-DVM-824, DSN-DVM-836, NR-PRIV-003; DEC-086)
tests:
  - {"name": "PRIV-1: declared classifications and the class default are part of the effective class", "kind": "scenario", "steps": [{"op": "effective_class", "input": {"class": "Contact", "classes": [{"name": "Contact", "label": "Contact", "description": "Contact", "namespace": "acme.scn", "parent": "DataObject", "kind": "definition", "schema_version": 1, "fields": [{"name": "name", "label": "name", "description": "name", "type": "text", "required": true, "classification": "personal"}, {"name": "email", "label": "email", "description": "email", "type": "text", "classification": "personal"}, {"name": "phone", "label": "phone", "description": "phone", "type": "text"}, {"name": "segment", "label": "segment", "description": "segment", "type": "text", "classification": "internal"}], "classification_default": "confidential"}, {"name": "VipContact", "label": "VipContact", "description": "VipContact", "namespace": "acme.scn", "parent": "Contact", "kind": "definition", "schema_version": 1, "fields": [{"name": "email", "label": "email", "description": "email", "type": "text", "classification": "sensitive_personal"}, {"name": "tier", "label": "tier", "description": "tier", "type": "text"}]}]}, "expect": {"match": "subset", "result": {"fields": {"name": {"classification": "personal"}, "email": {"classification": "personal"}, "segment": {"classification": "internal"}}}}}, {"op": "effective_class", "input": {"class": "VipContact", "classes": [{"name": "Contact", "label": "Contact", "description": "Contact", "namespace": "acme.scn", "parent": "DataObject", "kind": "definition", "schema_version": 1, "fields": [{"name": "name", "label": "name", "description": "name", "type": "text", "required": true, "classification": "personal"}, {"name": "email", "label": "email", "description": "email", "type": "text", "classification": "personal"}, {"name": "phone", "label": "phone", "description": "phone", "type": "text"}, {"name": "segment", "label": "segment", "description": "segment", "type": "text", "classification": "internal"}], "classification_default": "confidential"}, {"name": "VipContact", "label": "VipContact", "description": "VipContact", "namespace": "acme.scn", "parent": "Contact", "kind": "definition", "schema_version": 1, "fields": [{"name": "email", "label": "email", "description": "email", "type": "text", "classification": "sensitive_personal"}, {"name": "tier", "label": "tier", "description": "tier", "type": "text"}]}]}, "expect": {"match": "subset", "result": {"linearization": ["VipContact", "Contact", "DataObject", "Object"], "fields": {"name": {"classification": "personal"}, "email": {"classification": "sensitive_personal"}}}}}]}
  - {"name": "PRIV-2: a subclass may raise a classification but not lower it", "kind": "scenario", "steps": [{"op": "effective_class", "input": {"class": "VipContact", "classes": [{"name": "Contact", "label": "Contact", "description": "Contact", "namespace": "acme.scn", "parent": "DataObject", "kind": "definition", "schema_version": 1, "fields": [{"name": "name", "label": "name", "description": "name", "type": "text", "required": true, "classification": "personal"}, {"name": "email", "label": "email", "description": "email", "type": "text", "classification": "personal"}, {"name": "phone", "label": "phone", "description": "phone", "type": "text"}, {"name": "segment", "label": "segment", "description": "segment", "type": "text", "classification": "internal"}], "classification_default": "confidential"}, {"name": "VipContact", "label": "VipContact", "description": "VipContact", "namespace": "acme.scn", "parent": "Contact", "kind": "definition", "schema_version": 1, "fields": [{"name": "email", "label": "email", "description": "email", "type": "text", "classification": "internal"}, {"name": "tier", "label": "tier", "description": "tier", "type": "text"}]}]}, "expect": {"error_code": "MODEL.NARROWING_VIOLATION"}}]}
  - {"name": "PRIV-3: rectification corrects the current value; history keeps the earlier value (CR-GDPR-003)", "kind": "scenario", "clock": "2026-03-01T10:00:00.000000Z", "steps": [{"op": "commit", "input": {"branch": "main", "changes": [{"op": "create", "class": "Contact", "object_id": "01890a5d-ac96-7013-8000-000000000001", "slug": "c-1", "body": {"name": "Jane Roe", "email": "jane@old.example", "phone": "555-0100"}, "valid": {"from": "2026-01-01"}}]}, "expect": {"match": "subset", "result": {}}, "label": "c1"}, {"op": "read", "input": {"branch": "main", "object_id": "01890a5d-ac96-7013-8000-000000000001"}, "expect": {"match": "subset", "result": {}}, "label": "v1"}, {"advance": "9d"}, {"op": "commit", "input": {"branch": "main", "changes": [{"op": "update", "object_id": "01890a5d-ac96-7013-8000-000000000001", "base": {"$ref": "v1/version_hash"}, "body": {"email": "jane@new.example"}, "valid": {"from": "2026-01-01", "kind": "supersede_from"}}], "process": {"message": "subject request 42", "reason": "rectification"}}, "expect": {"match": "subset", "result": {}}, "label": "c2"}, {"op": "read", "input": {"branch": "main", "object_id": "01890a5d-ac96-7013-8000-000000000001"}, "expect": {"match": "subset", "result": {"body": {"name": "Jane Roe", "email": "jane@new.example", "phone": "555-0100"}, "valid": {"from": "2026-01-01", "to": null}}}}, {"op": "read", "input": {"branch": "main", "object_id": "01890a5d-ac96-7013-8000-000000000001", "asof": "2026-02-15"}, "expect": {"match": "subset", "result": {"body": {"email": "jane@new.example"}}}}, {"op": "read", "input": {"branch": "main", "object_id": "01890a5d-ac96-7013-8000-000000000001", "asof": "2026-02-15", "tx_time": "2026-03-01T12:00:00.000000Z"}, "expect": {"match": "subset", "result": {"body": {"email": "jane@old.example"}}}}, {"op": "history", "input": {"branch": "main", "object_id": "01890a5d-ac96-7013-8000-000000000001"}, "expect": {"match": "subset", "result": {"commits": [{"ops": [{"from": "2026-01-01", "kind": "create"}]}, {"ops": [{"from": "2026-01-01", "kind": "supersede_from"}]}]}}}]}
  - {"name": "PRIV-4: the audit trail names the rectification and keeps both values (CR-GDPR-003, FR-AUD-011)", "kind": "scenario", "clock": "2026-03-01T10:00:00.000000Z", "steps": [{"op": "commit", "input": {"branch": "main", "changes": [{"op": "create", "class": "Contact", "object_id": "01890a5d-ac96-7013-8000-000000000001", "slug": "c-1", "body": {"name": "Jane Roe", "email": "jane@old.example"}, "valid": {"from": "2026-01-01"}}]}, "expect": {"match": "subset", "result": {}}}, {"op": "read", "input": {"branch": "main", "object_id": "01890a5d-ac96-7013-8000-000000000001"}, "expect": {"match": "subset", "result": {}}, "label": "v1"}, {"op": "commit", "input": {"branch": "main", "changes": [{"op": "update", "object_id": "01890a5d-ac96-7013-8000-000000000001", "base": {"$ref": "v1/version_hash"}, "body": {"email": "jane@new.example"}, "valid": {"from": "2026-01-01", "kind": "supersede_from"}}], "process": {"message": "subject request 42", "reason": "rectification"}}, "expect": {"match": "subset", "result": {}}}, {"op": "audit", "input": {"branch": "main", "object_id": "01890a5d-ac96-7013-8000-000000000001"}, "expect": {"match": "subset", "result": {"items": [{"what": {"op": "added"}}, {"what": {"op": "changed", "fields": [{"path": "/email", "old": "jane@old.example", "new": "jane@new.example"}]}, "when": {"valid": {"from": "2026-01-01", "to": null}}, "why": {"message": "subject request 42", "reason": "rectification"}}]}}}]}
