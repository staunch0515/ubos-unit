tests:
  - {"name": "SCN-011 main: a process with the clock, entropy and a connector replays identically", "kind": "scenario", "clock": "2026-03-15T10:00:00.000000Z", "connectors": {"rate": {"get": {"usd": "1.10"}}}, "steps": [{"op": "execute", "input": {"branch": "feature/forge", "target": "01890a5d-ac96-7007-8000-000000000001", "port": "calculate", "params": {}, "process": {"process_id": "01890a5d-ac96-700d-8000-000000000001"}}, "expect": {"match": "subset", "result": {"metering": {"connector_calls": 1, "outcome": "ok"}}}, "label": "p"}, {"op": "journal", "input": {"process_id": "01890a5d-ac96-700d-8000-000000000001"}, "expect": {"match": "subset", "result": {"records": [{"instruction": "decision", "seq": 1}, {"instruction": "call.connector", "seq": 2}]}}}, {"op": "replay", "input": {"process_id": "01890a5d-ac96-700d-8000-000000000001"}, "expect": {"match": "subset", "result": {"outcome": "identical"}}}, {"op": "export_state", "input": {"branch": "feature/forge"}, "expect": {"match": "subset", "result": {}}, "label": "after"}]}
  - {"name": "SCN-011 A1: a missing journal record stops the replay without calling the connector", "kind": "scenario", "clock": "2026-03-15T10:00:00.000000Z", "connectors": {"rate": {"get": {"usd": "1.10"}}}, "steps": [{"op": "execute", "input": {"branch": "feature/forge", "target": "01890a5d-ac96-7007-8000-000000000001", "port": "calculate", "params": {}, "process": {"process_id": "01890a5d-ac96-700d-8000-000000000001"}}, "expect": {"match": "subset", "result": {}}}, {"op": "replay", "input": {"process_id": "01890a5d-ac96-700d-8000-000000000001", "drop": 1}, "expect": {"error_code": "LOGIC.REPLAY_INPUT_MISSING"}}]}
