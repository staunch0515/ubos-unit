# SCN-006 — Future-dated price becomes effective automatically (STD-TIME-050)
tests:
  - {"name": "SCN-006 main: a future-dated price is read by asof and becomes effective on its day without a job", "kind": "scenario", "clock": "2026-09-15T10:00:00.000000Z", "steps": [{"op": "read", "input": {"branch": "main", "object_id": "01890a5d-ac96-7004-8000-000000000001"}, "expect": {"match": "subset", "result": {"body": {"price": "100"}}}, "label": "v"}, {"op": "commit", "input": {"branch": "main", "changes": [{"op": "update", "object_id": "01890a5d-ac96-7004-8000-000000000001", "base": {"$ref": "v/version_hash"}, "body": {"price": "120"}, "valid": {"from": "2026-10-01", "kind": "supersede_from"}}]}, "expect": {"match": "subset", "result": {"retroactive": []}}}, {"op": "read", "input": {"branch": "main", "object_id": "01890a5d-ac96-7004-8000-000000000001", "asof": "2026-09-20"}, "expect": {"match": "subset", "result": {"body": {"price": "100"}, "valid": {"from": "2026-01-01", "to": "2026-10-01"}}}}, {"op": "read", "input": {"branch": "main", "object_id": "01890a5d-ac96-7004-8000-000000000001", "asof": "2026-10-05"}, "expect": {"match": "subset", "result": {"body": {"price": "120"}, "valid": {"from": "2026-10-01", "to": null}}}}, {"op": "read", "input": {"branch": "main", "object_id": "01890a5d-ac96-7004-8000-000000000001"}, "expect": {"match": "subset", "result": {"body": {"price": "100"}}}}, {"advance": "16d"}, {"op": "read", "input": {"branch": "main", "object_id": "01890a5d-ac96-7004-8000-000000000001"}, "expect": {"match": "subset", "result": {"body": {"price": "120"}}}}, {"op": "released_effects", "input": {}, "expect": {"match": "subset", "result": {"effects": [{"type": "BecameEffective", "object_id": "01890a5d-ac96-7004-8000-000000000001", "payload": {"valid_from": "2026-10-01"}}]}}}]}
  - {"name": "SCN-006 A1: a second future version; every date resolves to one version", "kind": "scenario", "clock": "2026-09-15T10:00:00.000000Z", "steps": [{"op": "read", "input": {"branch": "main", "object_id": "01890a5d-ac96-7004-8000-000000000001"}, "expect": {"match": "subset", "result": {}}, "label": "v"}, {"op": "commit", "input": {"branch": "main", "changes": [{"op": "update", "object_id": "01890a5d-ac96-7004-8000-000000000001", "base": {"$ref": "v/version_hash"}, "body": {"price": "120"}, "valid": {"from": "2026-10-01", "kind": "supersede_from"}}]}, "expect": {"match": "subset", "result": {}}, "label": "c1"}, {"op": "commit", "input": {"branch": "main", "changes": [{"op": "update", "object_id": "01890a5d-ac96-7004-8000-000000000001", "base": {"$ref": "c1/versions/01890a5d-ac96-7004-8000-000000000001"}, "body": {"price": "130"}, "valid": {"from": "2026-11-01", "kind": "supersede_from"}}]}, "expect": {"match": "subset", "result": {}}}, {"op": "read", "input": {"branch": "main", "object_id": "01890a5d-ac96-7004-8000-000000000001", "asof": "2026-10-15"}, "expect": {"match": "subset", "result": {"body": {"price": "120"}, "valid": {"from": "2026-10-01", "to": "2026-11-01"}}}}, {"op": "read", "input": {"branch": "main", "object_id": "01890a5d-ac96-7004-8000-000000000001", "asof": "2026-11-15"}, "expect": {"match": "subset", "result": {"body": {"price": "130"}, "valid": {"from": "2026-11-01", "to": null}}}}, {"op": "read", "input": {"branch": "main", "object_id": "01890a5d-ac96-7004-8000-000000000001", "asof": "2026-09-30"}, "expect": {"match": "subset", "result": {"body": {"price": "100"}, "valid": {"from": "2026-01-01", "to": "2026-10-01"}}}}, {"op": "history", "input": {"branch": "main", "object_id": "01890a5d-ac96-7004-8000-000000000001"}, "expect": {"match": "subset", "result": {}}}]}
