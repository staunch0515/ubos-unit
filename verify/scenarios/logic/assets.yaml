  - {"name": "acme.agreements", "abi": "1.0", "tier": "l2", "profile": "standard", "state": "committed", "capabilities": ["read", "commit"], "exports": ["terminate", "terminate_service"], "source": "fn terminate() { sys.read.get(#{target: self_id}); sys.commit.update(#{target: self_id, set: #{state: \"terminated\"}}); \"terminated\" }\nfn terminate_service() {\n  if this.in_notice_period == true {\n    return #{denied: true, guard: \"notice period\", rule: \"ServiceAgreement.terminate overrides Agreement.terminate\"};\n  }\n  sys.read.get(#{target: self_id}); sys.commit.update(#{target: self_id, set: #{state: \"terminated\"}}); \"terminated\"\n}\n"}
