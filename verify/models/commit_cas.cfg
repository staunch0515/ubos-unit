\* VER-FORM-0001 bounds (UBS-PH-0 section 7.4): 3 processes x 2 nodes x 3 objects x 4 commits.
CONSTANTS
    Procs = {p1, p2, p3}
    Nodes = {n1, n2}
    Objs = {x1, x2, x3}
    Serializable = {p1}
    MaxCommits = 4
    MaxAttempts = 2
SYMMETRY Symm
SPECIFICATION Spec
INVARIANTS TypeOK LinearHistory DenseCseq NoLostUpdate SerializableReads FailuresJustified
CHECK_DEADLOCK FALSE
