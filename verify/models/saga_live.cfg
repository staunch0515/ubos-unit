\* Liveness of VER-FORM-0101 at a bound that completes (DEC-031): the bounds of saga.cfg with 1 coordinator crash
\* instead of 2 and 1 attempt instead of 2 (2 coordinators, 1 lost invocation, every declaration).
CONSTANTS
    N = 3
    Coords = {c1, c2}
    MaxAttempts = 1
    Recoveries = {"backward", "forward"}
    TimeoutActions = {"compensate", "escalate"}
    CompChoices = {TRUE, FALSE}
    CompCanFail = TRUE
    MaxCrashes = 1
    MaxLost = 1
    Mutation = "none"
SPECIFICATION FairSpec
INVARIANTS TypeOK
PROPERTIES Terminates EndsCompletedOrCompensated EndsAsDeclared
CHECK_DEADLOCK FALSE
