\* CI bounds (reduced): 3 steps x 2 coordinators, 1 coordinator crash, 1 lost invocation, backward recovery,
\* timeout action "compensate" or "escalate", every step with a compensation. Full bounds: saga.cfg.
CONSTANTS
    N = 3
    Coords = {c1, c2}
    MaxAttempts = 1
    Recoveries = {"backward"}
    TimeoutActions = {"compensate", "escalate"}
    CompChoices = {TRUE}
    CompCanFail = FALSE
    MaxCrashes = 1
    MaxLost = 1
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS TypeOK ForwardAtMostOnce CompensateAtMostOnce CompensationReverseOrder NoCompensationOfUnappliedStep NoForwardAfterCompensationStarts CompensationOnlyWhileCompensating StateMatchesEffects CompletedAllAppliedOnce CompensatedNetEmpty TerminalStable EndJustified
PROPERTIES Terminates EndsCompletedOrCompensated EndsAsDeclared
CHECK_DEADLOCK FALSE
