\* CI bounds (reduced): 2 approvers x 2 editors x 2 objects, 1 pending change, count 1 or 2, 2 direct edits,
\* 1 incompatible call, 1 re-run. No symmetry (liveness). Full bounds: approval_live.cfg.
CONSTANTS
    Editors = {e1, e2}
    Approvers = {a1, a2}
    Objs = {x1, x2}
    Changes = {c1}
    Counts = {1, 2}
    MaxEdits = 2
    MaxDuty = 1
    MaxReruns = 1
    Mutation = "none"
SPECIFICATION FairSpec
INVARIANTS TypeOK
PROPERTIES Terminates
CHECK_DEADLOCK FALSE
