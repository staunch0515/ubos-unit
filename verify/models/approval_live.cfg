\* Liveness at the VER-FORM-0100 bound for one pending change: 2 approvers x 3 editors x 3 objects, count 1 or 2,
\* 2 direct edits, 1 incompatible call, 2 re-runs. No symmetry (liveness).
CONSTANTS
    Editors = {e1, e2, e3}
    Approvers = {a1, a2}
    Objs = {x1, x2, x3}
    Changes = {c1}
    Counts = {1, 2}
    MaxEdits = 2
    MaxDuty = 1
    MaxReruns = 2
    Mutation = "none"
SPECIFICATION FairSpec
INVARIANTS TypeOK
PROPERTIES Terminates
CHECK_DEADLOCK FALSE
