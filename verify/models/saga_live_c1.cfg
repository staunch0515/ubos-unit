\* Liveness of VER-FORM-0101 at a bound that completes (DEC-031): the bounds of saga.cfg with 1 coordinator
\* instead of 2 (2 crashes, 1 lost invocation, every declaration, 2 attempts). Module: saga_live.tla.
CONSTANTS
    N = 3
    Coords = {c1}
    MaxAttempts = 2
    Recoveries = {"backward", "forward"}
    TimeoutActions = {"compensate", "escalate"}
    CompChoices = {TRUE, FALSE}
    CompCanFail = TRUE
    MaxCrashes = 2
    MaxLost = 1
    Mutation = "none"
SPECIFICATION FairSpec
INVARIANTS TypeOK
PROPERTIES Terminates EndsCompletedOrCompensated EndsAsDeclared
CHECK_DEADLOCK FALSE
