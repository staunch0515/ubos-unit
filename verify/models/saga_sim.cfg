\* Liveness of VER-FORM-0101 at the bounds of saga.cfg, for the simulation of DEC-031 (1,000,000 behaviours);
\* the exhaustive liveness run does not complete at this bound. Module: saga_live.tla.
CONSTANTS
    N = 3
    Coords = {c1, c2}
    MaxAttempts = 2
    Recoveries = {"backward", "forward"}
    TimeoutActions = {"compensate", "escalate"}
    CompChoices = {TRUE, FALSE}
    CompCanFail = TRUE
    MaxCrashes = 2
    MaxLost = 1
    Mutation = "none"
SPECIFICATION FairSpec
INVARIANTS TypeOK
PROPERTIES Terminates EndsCompletedOrCompensated EndsAsDeclared
CHECK_DEADLOCK FALSE
