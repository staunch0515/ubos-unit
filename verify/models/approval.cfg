\* VER-FORM-0100 bounds: 2 approvers x 3 editors x 3 objects, 2 pending changes, count 1 or 2,
\* 2 direct edits, 1 incompatible call, 1 re-run per pending change.
CONSTANTS
    Editors = {e1, e2, e3}
    Approvers = {a1, a2}
    Objs = {x1, x2, x3}
    Changes = {c1, c2}
    Counts = {1, 2}
    MaxEdits = 2
    MaxDuty = 1
    MaxReruns = 1
    Mutation = "none"
SYMMETRY Symm
SPECIFICATION Spec
INVARIANTS TypeOK NoCommitWithoutValidApprovals StaleApprovalsNeverCount SoDHolds CommittedEqualsApproved
PROPERTIES TargetUnchangedWhilePending
CHECK_DEADLOCK FALSE
