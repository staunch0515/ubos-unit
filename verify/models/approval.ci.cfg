\* CI bounds (reduced): 2 approvers x 2 editors x 2 objects, 2 pending changes, count 1 or 2, 1 direct edit,
\* 1 incompatible call, 1 re-run per pending change. Full bounds: approval.cfg. Liveness: approval_live.
CONSTANTS
    Editors = {e1, e2}
    Approvers = {a1, a2}
    Objs = {x1, x2}
    Changes = {c1, c2}
    Counts = {1, 2}
    MaxEdits = 1
    MaxDuty = 1
    MaxReruns = 1
    Mutation = "none"
SYMMETRY Symm
SPECIFICATION Spec
INVARIANTS TypeOK NoCommitWithoutValidApprovals StaleApprovalsNeverCount SoDHolds CommittedEqualsApproved
PROPERTIES TargetUnchangedWhilePending
CHECK_DEADLOCK FALSE
