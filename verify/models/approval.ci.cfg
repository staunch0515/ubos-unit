\* CI bounds (reduced): 2 approvers x 2 editors x 2 objects, 2 pending changes, count 2, 1 direct edit,
\* 1 incompatible call, 1 re-run. No symmetry, so that the liveness property is checked. Full bounds: approval.cfg.
CONSTANTS
    Editors = {e1, e2}
    Approvers = {a1, a2}
    Objs = {x1, x2}
    Changes = {c1, c2}
    Counts = {2}
    MaxEdits = 1
    MaxDuty = 1
    MaxReruns = 1
    Mutation = "none"
SPECIFICATION FairSpec
INVARIANTS TypeOK NoCommitWithoutValidApprovals StaleApprovalsNeverCount SoDHolds CommittedEqualsApproved
PROPERTIES TargetUnchangedWhilePending Terminates
CHECK_DEADLOCK FALSE
