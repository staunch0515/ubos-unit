\* VER-FORM-0101 bounds: a 3-step saga, steps that end ok, fail or time out, 2 attempts under forward recovery, 2 coordinator crashes; both recovery modes and compensations that may or may not fail.
CONSTANTS
    N = 3
    MaxAttempts = 2
    MaxCrashes = 2
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS TypeOK AtMostOnce CompAfterExec ReverseOrder CompletedOK CompensatedOK FailedJustified EndsCompletedOrCompensated
PROPERTIES Termination
CHECK_DEADLOCK FALSE
