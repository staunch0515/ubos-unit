\* VER-FORM-0100 bounds: 2 approvers x 3 editors x 3 objects, 2 proposals, change sets with one source commit.
CONSTANTS
    Approvers = {a1, a2}
    Editors = {e1, e2, e3}
    Objs = {o1, o2, o3}
    Required = 2
    MaxVer = 2
    MaxProps = 2
    MaxRev = 1
    Mutation = "none"
SYMMETRY Symm
SPECIFICATION Spec
INVARIANTS TypeOK NoCommitWithoutApprovals StaleNeverCount SoDHolds NoLostUpdate AppliedOnce
CHECK_DEADLOCK FALSE
