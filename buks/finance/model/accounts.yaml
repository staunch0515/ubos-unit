# Chart of accounts and fiscal periods (FIN-GL, FIN-PC; STD-KIND-025, -029).
classes:
  - name: GlAccount
    label: GL account
    description: An account of the general ledger; extends the genesis LedgerAccount with its category, normal balance and statement line
    namespace: ubos.finance
    parent: LedgerAccount
    kind: definition
    schema_version: 1
    fields:
      - name: category
        label: category
        description: the account category of the chart
        type: enum
        required: true
        constraints: {allowed_values: [Asset, Liability, Equity, Revenue, Expense, Other, Tax]}
      - name: normal_balance
        label: normal balance
        description: D for debit, C for credit
        type: enum
        required: true
        constraints: {allowed_values: [D, C]}
      - name: statement_line
        label: statement line
        description: the line of the financial statements the account reports on
        type: text
        required: true
      - name: control
        label: control
        description: the subledger a control account belongs to; only it posts to the account (FIN-GL-005)
        type: enum
        constraints: {allowed_values: [receivables, payables, fixed_assets, bank]}
      - {name: suspense, label: suspense, description: "a suspense or clearing account, which must be zero to close a period (FIN-PC-004)", type: boolean}
  - name: FiscalPeriod
    label: fiscal period
    description: A fiscal period [start, end) that governs the journal (STD-KIND-025)
    namespace: ubos.finance
    parent: DataObject
    kind: definition
    schema_version: 1
    fields:
      - {name: start, label: start, description: first day of the period, type: date, required: true}
      - {name: end, label: end, description: first day after the period, type: date, required: true}
      - name: state
        label: state
        description: open, closing or closed
        type: enum
        required: true
        constraints: {allowed_values: [open, closing, closed]}
      - {name: fiscal_year, label: fiscal year, description: the fiscal year the period belongs to, type: text}
      - {name: number, label: number, description: the period's number in its year (1-12; 13 for the adjustment period), type: integer}
      - {name: checklist, label: checklist, description: "the results of the automatic close checks when the period was soft-closed: {check, passed, evidence} (FIN-PC-004, -005)", type: json}
    ports:
      - {name: open, description: post the automatic reversals dated in the period (FIN-GL-018), kind: command, params: [], permission: open, impl: ubos.finance.periods#open}
      - name: checklist
        description: "the automatic close checks: no unposted documents dated in the period, every bank account with statement lines in the period reconciled, receivables and payables equal to their control accounts, the depreciation and revaluation runs done, the recurring entries created, the suspense accounts at zero (FIN-PC-004)"
        kind: query
        params: []
        permission: read
        impl: ubos.finance.periods#checklist
      - name: soft_close
        description: "move the period to closing when every check passes, keeping the results; refused naming the failing checks (FIN-PC-004, SCN-506). close_period then closes it."
        kind: command
        params: []
        permission: close
        impl: ubos.finance.periods#soft_close
      - name: reopen
        description: reopen the closed period through reopen_period; the sheet ubos.finance.controls requires a controller's approval (FIN-PC-006)
        kind: command
        params:
          - {name: reason, label: reason, description: why the period is reopened, type: text, required: true}
        permission: reopen
        impl: ubos.finance.periods#reopen
  - name: FiscalYear
    label: fiscal year
    description: A fiscal year; `close` transfers the year's result to retained earnings with a closing entry (FIN-PC-008)
    namespace: ubos.finance
    parent: DataObject
    kind: definition
    schema_version: 1
    fields:
      - {name: year, label: year, description: the fiscal year, type: text, required: true}
      - {name: first_day, label: first day, description: the first day of the year, type: date, required: true}
      - {name: last_day, label: last day, description: the last day of the year, type: date, required: true}
      - name: state
        label: state
        description: open or closed
        type: enum
        required: true
        constraints: {allowed_values: [open, closed]}
      - {name: retained_earnings, label: retained earnings, description: the account the result is closed to, type: reference, required: true, constraints: {target_class: GlAccount}}
      - {name: closes, label: closes, description: "the closes of the year: {number, superseded}; a later close supersedes the earlier ones", type: json}
    ports:
      - {name: close, description: close the year's income and expense accounts to retained earnings, kind: command, params: [], permission: close, impl: ubos.finance.years#close}
  - name: RecurringEntry
    label: recurring entry
    description: The template of a recurring journal entry; `run` creates the period's entry once (FIN-GL-017)
    namespace: ubos.finance
    parent: DataObject
    kind: definition
    schema_version: 1
    fields:
      - {name: code, label: code, description: the template's code; the entry of a period is numbered <code>-<yyyy-mm>, type: text, required: true}
      - {name: description, label: description, description: the entries' description, type: text, required: true}
      - name: source
        label: source
        description: the entries' source; manual entries follow the same approval rules
        type: enum
        required: true
        constraints: {allowed_values: [manual, recurring]}
      - {name: lines, label: lines, description: "the lines: {account, amount}", type: json, required: true}
      - {name: total, label: total, description: the sum of the debits, type: money, required: true}
      - {name: first_period_end, label: first period end, description: the end of the first period the template runs for, type: date, required: true}
      - {name: last_period_end, label: last period end, description: the end of the last period, if any, type: date}
    ports:
      - name: run
        description: create the entry of the period ending on period_end, once
        kind: command
        params:
          - {name: period_end, label: period end, description: the last day of the period, type: date, required: true}
        permission: run
        impl: ubos.finance.recurring#run
