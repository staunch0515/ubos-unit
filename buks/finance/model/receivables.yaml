# Receivables and sales tax (FIN-AR, FIN-TX; PH-2 step 10b, DEC-148).
classes:
  - name: TaxCode
    label: tax code
    description: A sales-tax code of a jurisdiction with its rate (FIN-TX-001, -002)
    namespace: ubos.finance
    parent: DataObject
    kind: definition
    schema_version: 1
    keys: [[code]]
    fields:
      - {name: code, label: code, description: the code, type: text, required: true}
      - {name: description, label: description, description: what the code means, type: text, required: true}
      - {name: rate, label: rate, description: the rate in percent, type: decimal, required: true}
      - name: category
        label: category
        description: taxable, exempt with a certificate, non-taxable or export
        type: enum
        required: true
        constraints: {allowed_values: [taxable, exempt, non_taxable, export]}
      - {name: components, label: components, description: "the jurisdictions the code combines: {jurisdiction (URI of a TaxJurisdiction), rate in percent}; their rates add up to the code's rate. A rate change is a new version from its effective date; a document is taxed at the version valid on its date (FIN-TX-001)", type: json}
      - {name: certificate_required, label: certificate required, description: a sale under this code needs a valid exemption or resale certificate of the customer (FIN-TX-004), type: boolean}
      - {name: payable_account, label: payable account, description: the sales-tax payable account (FIN-TX-006), type: reference, constraints: {target_class: GlAccount}}
  - name: TaxJurisdiction
    label: tax jurisdiction
    description: "A sales-tax jurisdiction: a state, county, city or special district (FIN-TX-001)"
    namespace: ubos.finance
    parent: DataObject
    kind: definition
    schema_version: 1
    keys: [[code]]
    fields:
      - {name: code, label: code, description: the jurisdiction's code, type: text, required: true}
      - {name: name, label: name, description: the jurisdiction's name, type: text, required: true}
      - name: level
        label: level
        description: state, county, city or special district
        type: enum
        required: true
        constraints: {allowed_values: [state, county, city, special]}
      - {name: state, label: state, description: the state it belongs to, type: text, required: true}
  - name: Customer
    label: customer
    description: A customer (FIN-AR-001)
    namespace: ubos.finance
    parent: DataObject
    kind: definition
    schema_version: 1
    keys: [[code]]
    fields:
      - {name: code, label: code, description: the customer ID, type: text, required: true}
      - {name: name, label: name, description: the legal name, type: text, required: true}
      - {name: location, label: location, description: the ship-to jurisdiction, type: text}
      - {name: currency, label: currency, description: the invoicing currency, type: text, required: true}
      - {name: tax_code, label: tax code, description: the default tax code, type: reference, required: true, constraints: {target_class: TaxCode}}
      - {name: terms_days, label: terms, description: net days to the due date (FIN-AR-002), type: integer, required: true}
      - {name: terms, label: payment terms, description: "payment terms with a discount or end of month; they take precedence over terms_days (FIN-AR-002)", type: reference, constraints: {target_class: PaymentTerms}}
      - {name: billing_address, label: billing address, description: the billing address (FIN-AR-001), type: text}
      - {name: shipping_address, label: shipping address, description: the ship-to address, which decides the tax jurisdiction (FIN-AR-001), type: text}
      - {name: contacts, label: contacts, description: "the contacts: {name, role, email, phone}", type: json}
      - name: status
        label: status
        description: active, on hold or inactive; no invoice is posted for an inactive customer (FIN-AR-001)
        type: enum
        constraints: {allowed_values: [active, on_hold, inactive]}
      - {name: certificate, label: certificate, description: the exemption or resale certificate number, type: text}
      - {name: certificate_valid_to, label: certificate valid to, description: the last day the certificate is valid, type: date}
      - {name: receivable_account, label: receivable account, description: the receivables control account, type: reference, required: true, constraints: {target_class: GlAccount}}
      - {name: credit_limit, label: credit limit, description: the most the customer may owe (FIN-AR-013), type: money}
      - name: credit_action
        label: credit action
        description: "over the limit, warn on posting, or refuse unless the invoice carries a credit override, which a controller approves (FIN-AR-013); warn when absent"
        type: enum
        constraints: {allowed_values: [warn, approve]}
  - name: Invoice
    label: invoice
    description: A customer invoice or credit memo; `post` computes tax, posts to the general ledger and records the open item (FIN-AR-003, -004, -006, FIN-TX-003, -005)
    namespace: ubos.finance
    parent: DataObject
    kind: definition
    schema_version: 1
    keys: [[number]]
    fields:
      - {name: number, label: number, description: the document number, type: text, required: true}
      - name: kind
        label: kind
        description: invoice or credit memo
        type: enum
        required: true
        constraints: {allowed_values: [invoice, credit_memo]}
      - {name: customer, label: customer, description: the customer, type: reference, required: true, constraints: {target_class: Customer}}
      - {name: invoice_date, label: invoice date, description: the document and posting date, type: date, required: true}
      - {name: due_date, label: due date, description: computed from the terms when absent, type: date}
      - {name: description, label: description, description: the document's description, type: text, required: true}
      - {name: currency, label: currency, description: "the document currency; the customer's invoicing currency when absent (FIN-FX-003)", type: text}
      - {name: rate, label: rate, description: "the rate to the functional currency entered for the document; the spot rate of the invoice date when absent (FIN-FX-003)", type: decimal}
      - {name: lines, label: lines, description: "the lines: {description, quantity?, unit_price?, amount (money in the document currency, positive; quantity times unit price when both are given, FIN-AR-003), account (revenue or returns account), tax_code (URI of a TaxCode)}", type: json, required: true}
      - {name: discount_date, label: discount date, description: the last day an early-payment discount is offered, computed on posting (FIN-AR-002), type: date}
      - {name: discount, label: discount, description: the early-payment discount offered, computed on posting, type: money}
      - {name: voided_on, label: voided on, description: the date of the reversing entry that voided the invoice (FIN-AR-004), type: date}
      - {name: applies_to, label: applies to, description: the invoice a credit memo is applied to, type: text}
      - {name: tax, label: tax, description: the tax computed on posting, type: money}
      - {name: total, label: total, description: the total with tax, computed on posting, type: money}
      - {name: functional_total, label: functional total, description: the total in the functional currency, computed on posting (FIN-FX-003), type: money}
      - {name: credit_override, label: credit override, description: "why an invoice over the customer's credit limit is issued; the sheet ubos.finance.controls requires a controller's approval (FIN-AR-013)", type: text}
      - {name: written_off_on, label: written off on, description: the date the invoice was written off (FIN-AR-012), type: date}
      - name: state
        label: state
        description: draft until posted; a posted document is not changed (FIN-AR-004)
        type: enum
        constraints: {allowed_values: [draft, posted]}
    ports:
      - {name: post, description: post the document, kind: command, params: [], permission: post, impl: ubos.finance.receivables#post_invoice}
      - name: void
        description: "void a posted invoice on which nothing was received, by a reversing entry dated in an open period; the invoice stays with its number (FIN-AR-004)"
        kind: command
        params:
          - {name: void_date, label: date, description: the date of the reversing entry, type: date, required: true}
          - {name: reason, label: reason, description: why, type: text, required: true}
        permission: void
        impl: ubos.finance.receivables#void_invoice
  - name: Receipt
    label: receipt
    description: A customer receipt and its application to open items (FIN-AR-007, -008)
    namespace: ubos.finance
    parent: DataObject
    kind: definition
    schema_version: 1
    keys: [[number]]
    fields:
      - {name: number, label: number, description: the receipt number, type: text, required: true}
      - {name: customer, label: customer, description: the customer, type: reference, required: true, constraints: {target_class: Customer}}
      - {name: receipt_date, label: date, description: the date received, type: date, required: true}
      - {name: amount, label: amount, description: the amount received, in the receipt currency, type: money, required: true}
      - {name: rate, label: rate, description: "the rate to the functional currency entered for the receipt; the spot rate of the receipt date when absent (FIN-FX-003)", type: decimal}
      - {name: functional_amount, label: functional amount, description: the amount in the functional currency, computed on posting, type: money}
      - {name: method, label: method, description: check, ACH, wire or card, type: text}
      - {name: reference, label: reference, description: the payer's reference, type: text}
      - {name: bank_account, label: bank account, description: the deposit account, type: reference, required: true, constraints: {target_class: GlAccount}}
      - {name: applications, label: applications, description: "{document, amount in the receipt currency, discount?}; the rest stays unapplied; a discount taken by the discount date posts to the discount account (FIN-AR-002)", type: json}
      - name: state
        label: state
        description: draft until posted
        type: enum
        constraints: {allowed_values: [draft, posted]}
    ports:
      - {name: post, description: post the receipt and apply it, kind: command, params: [], permission: post, impl: ubos.finance.receivables#post_receipt}
      - name: reapply
        description: move an applied amount from one open item to another, keeping the history (FIN-AR-008)
        kind: command
        params:
          - {name: from_document, label: from, description: the item the amount is taken from, type: text, required: true}
          - {name: to_document, label: to, description: the item it is applied to, type: text, required: true}
          - {name: amount, label: amount, description: the amount moved, type: money, required: true}
        permission: apply
        impl: ubos.finance.receivables#reapply
  - name: Receivables
    label: receivables
    description: The receivables subledger's reports
    namespace: ubos.finance
    parent: DataObject
    kind: definition
    schema_version: 1
    fields:
      - {name: name, label: name, description: the subledger's name, type: text, required: true}
      - {name: control_account, label: control account, description: the receivables control account (FIN-RP-007), type: reference, required: true, constraints: {target_class: GlAccount}}
      - {name: functional_currency, label: functional currency, description: the functional currency of the company (FIN-FX-001), type: text, required: true}
      - {name: rate_type, label: rate type, description: "the type of the FxRate objects the subledger converts with (FIN-FX-002)", type: text, required: true}
      - {name: discount_account, label: discount account, description: the account of early-payment discounts allowed (FIN-AR-002), type: reference, constraints: {target_class: GlAccount}}
      - {name: allowance_account, label: allowance account, description: the allowance for credit losses (FIN-AR-011, -012), type: reference, constraints: {target_class: GlAccount}}
      - {name: loss_rates, label: loss rates, description: "the loss rate in percent by aging bucket, for the suggested allowance: {bucket: rate} (FIN-AR-011)", type: json}
      - {name: realized_account, label: realized FX account, description: the realized exchange gain or loss account (FIN-FX-004), type: reference, required: true, constraints: {target_class: GlAccount}}
      - {name: unrealized_account, label: unrealized FX account, description: the unrealized exchange gain or loss account (FIN-FX-005), type: reference, required: true, constraints: {target_class: GlAccount}}
    ports:
      - name: aging
        description: the open items by due-date bucket as of a date, with the control account (FIN-AR-010, FIN-RP-007)
        kind: query
        params:
          - {name: as_of, label: as of, description: the date, type: date, required: true}
        permission: read
        impl: ubos.finance.receivables#aging
      - name: tax_report
        description: taxable, exempt and tax collected per tax code for a period (FIN-TX-008)
        kind: query
        params:
          - {name: opening, label: opening, description: the last day before the period, type: date, required: true}
          - {name: closing, label: closing, description: the last day of the period, type: date, required: true}
        permission: read
        impl: ubos.finance.receivables#tax_report
      - name: statement
        description: a customer's statement for a period (FIN-AR-009)
        kind: query
        params:
          - {name: customer, label: customer, description: the customer code, type: text, required: true}
          - {name: opening, label: opening, description: the last day before the period, type: date, required: true}
          - {name: closing, label: closing, description: the last day of the period, type: date, required: true}
        permission: read
        impl: ubos.finance.receivables#statement
      - name: refund
        description: "pay back a customer's credit (an unapplied receipt or a credit memo standing alone) from a bank account (FIN-AR-006)"
        kind: command
        params:
          - {name: number, label: number, description: the refund's number, type: text, required: true}
          - {name: customer, label: customer, description: the customer code, type: text, required: true}
          - {name: document, label: document, description: the credit item, type: text, required: true}
          - {name: amount, label: amount, description: the amount refunded, type: money, required: true}
          - {name: refund_date, label: date, description: the date, type: date, required: true}
          - {name: bank_account, label: bank account, description: the account paid from, type: reference, required: true, constraints: {target_class: GlAccount}}
        permission: post
        impl: ubos.finance.receivables#refund
      - name: allowance
        description: "the allowance suggested by the loss rates on the aging at a date, against the allowance account's balance (FIN-AR-011); it is recorded by a journal entry"
        kind: query
        params:
          - {name: as_of, label: as of, description: the date, type: date, required: true}
        permission: read
        impl: ubos.finance.receivables#allowance
      - name: revalue
        description: "remeasure the open foreign-currency items at the rate of the period end, post the unrealized gain or loss as FXR-<yymm> reversing on the next day; with simulate, show the run and its difference to the posted one without posting (FIN-FX-005)"
        kind: command
        params:
          - {name: period_end, label: period end, description: the last day of the period, type: date, required: true}
          - {name: simulate, label: simulate, description: compute without posting, type: boolean}
        permission: post
        impl: ubos.finance.receivables#revalue
      - name: fx_report
        description: realized and unrealized exchange gains and losses by document for a period (FIN-FX-007)
        kind: query
        params:
          - {name: opening, label: opening, description: the last day before the period, type: date, required: true}
          - {name: closing, label: closing, description: the last day of the period, type: date, required: true}
        permission: read
        impl: ubos.finance.receivables#fx_report
  - name: ArItem
    label: receivable item
    description: The receivables subledger; an item's balance is the sum of its document's entries
    namespace: ubos.finance
    parent: DataObject
    kind: ledger
    schema_version: 1
    ledger: {key: [customer], amounts: [amount], double_entry: false}
    fields:
      - {name: customer, label: customer, description: the customer code, type: text, required: true}
      - {name: document, label: document, description: the open item (invoice number, or UNAPPLIED-<receipt>), type: text, required: true}
      - {name: amount, label: amount, description: "in the functional currency: positive for invoices, negative for credits and receipts", type: money, required: true}
      - {name: original, label: original, description: the amount in the document currency (FIN-FX-007), type: money, required: true}
      - {name: kind, label: kind, description: "opening, invoice, credit_memo, receipt, reapply or revaluation", type: text, required: true}
      - {name: source, label: source, description: the document that wrote the entry, type: text, required: true}
      - {name: invoice_date, label: invoice date, description: the item's document date, type: date, required: true}
      - {name: due, label: due, description: the item's due date, type: date, required: true}
  - name: TaxLine
    label: tax line
    description: The sales-tax detail of posted documents (FIN-TX-003, -008)
    namespace: ubos.finance
    parent: DataObject
    kind: ledger
    schema_version: 1
    ledger: {key: [tax_code], amounts: [taxable, exempt, tax], double_entry: false}
    fields:
      - {name: tax_code, label: tax code, description: the tax code, type: text, required: true}
      - {name: document, label: document, description: the invoice or credit memo, type: text, required: true}
      - {name: customer, label: customer, description: the customer code, type: text, required: true}
      - {name: taxable, label: taxable, description: taxable sales, type: money, required: true}
      - {name: exempt, label: exempt, description: exempt or non-taxable sales, type: money, required: true}
      - {name: tax, label: tax, description: tax collected, type: money, required: true}
  - name: FxGain
    label: exchange gain or loss
    description: "The realized and unrealized exchange gains and losses of foreign-currency items, by document (FIN-FX-004, -005, -007); gains negative, as on the gain-or-loss accounts"
    namespace: ubos.finance
    parent: DataObject
    kind: ledger
    schema_version: 1
    ledger: {key: [document], amounts: [amount], double_entry: false}
    fields:
      - {name: document, label: document, description: the foreign-currency item, type: text, required: true}
      - {name: customer, label: customer, description: the customer code, for a receivable, type: text}
      - {name: vendor, label: vendor, description: the vendor code, for a payable (10g-2), type: text}
      - name: kind
        label: kind
        description: realized or unrealized
        type: enum
        required: true
        constraints: {allowed_values: [realized, unrealized]}
      - {name: source, label: source, description: the journal entry that posted it, type: text, required: true}
      - {name: amount, label: amount, description: "the gain (negative) or loss (positive) in the functional currency", type: money, required: true}
      - {name: rate, label: rate, description: the rate applied, type: decimal}
  - name: WriteOff
    label: write-off
    description: "The write-off of an uncollectible invoice against the allowance, or the recovery of an amount written off (FIN-AR-012). The sheet ubos.finance.controls requires a controller's approval to post one."
    namespace: ubos.finance
    parent: DataObject
    kind: definition
    schema_version: 1
    keys: [[number]]
    fields:
      - {name: number, label: number, description: the document number, type: text, required: true}
      - name: kind
        label: kind
        description: a write-off, or a recovery that reinstates the amount before it is received
        type: enum
        required: true
        constraints: {allowed_values: [write_off, recovery]}
      - {name: customer, label: customer, description: the customer, type: reference, required: true, constraints: {target_class: Customer}}
      - {name: document, label: document, description: the open item written off or recovered, type: text, required: true}
      - {name: amount, label: amount, description: the amount, type: money, required: true}
      - {name: date, label: date, description: the posting date, type: date, required: true}
      - {name: reason, label: reason, description: why, type: text, required: true}
      - name: state
        label: state
        description: draft until posted
        type: enum
        constraints: {allowed_values: [draft, posted]}
    ports:
      - {name: post, description: post the write-off or recovery, kind: command, params: [], permission: post, impl: ubos.finance.receivables#post_write_off}
  - name: RecurringInvoice
    label: recurring invoice
    description: "The template of a recurring invoice; `run` creates and posts the invoice of a period once (FIN-AR-014)"
    namespace: ubos.finance
    parent: DataObject
    kind: definition
    schema_version: 1
    keys: [[code]]
    fields:
      - {name: code, label: code, description: the template's code; the invoice of a period is numbered <code>-<yyyy-mm>, type: text, required: true}
      - {name: customer, label: customer, description: the customer, type: reference, required: true, constraints: {target_class: Customer}}
      - {name: description, label: description, description: the invoices' description, type: text, required: true}
      - {name: lines, label: lines, description: the invoice lines, as on Invoice, type: json, required: true}
      - {name: first_period_end, label: first period end, description: the end of the first period, type: date, required: true}
      - {name: last_period_end, label: last period end, description: the end of the last period, if any, type: date}
    ports:
      - name: run
        description: create and post the invoice of the period ending on period_end, dated that day, once
        kind: command
        params:
          - {name: period_end, label: period end, description: the last day of the period, type: date, required: true}
        permission: run
        impl: ubos.finance.receivables#run_recurring
  - name: PaymentTerms
    label: payment terms
    description: "Payment terms: net days from the document date or from the end of its month, and an optional early-payment discount, for example 2/10 net 30 (FIN-AR-002)"
    namespace: ubos.finance
    parent: DataObject
    kind: definition
    schema_version: 1
    keys: [[code]]
    fields:
      - {name: code, label: code, description: the terms' code, type: text, required: true}
      - {name: net_days, label: net days, description: the days to the due date, type: integer, required: true}
      - {name: end_of_month, label: end of month, description: the net days count from the end of the document's month, type: boolean}
      - {name: discount_days, label: discount days, description: the days in which the discount is offered, type: integer}
      - {name: discount_percent, label: discount percent, description: the discount in percent of the total, type: decimal}
  - name: TaxPart
    label: tax part
    description: "The tax of a document by jurisdiction: the tax of a code allocated to its components in proportion to their rates, the rest to the last (FIN-TX-001, -008)"
    namespace: ubos.finance
    parent: DataObject
    kind: ledger
    schema_version: 1
    ledger: {key: [tax_code], amounts: [tax], double_entry: false}
    fields:
      - {name: tax_code, label: tax code, description: the tax code, type: text, required: true}
      - {name: jurisdiction, label: jurisdiction, description: the jurisdiction's code, type: text, required: true}
      - {name: document, label: document, description: the invoice or credit memo, type: text, required: true}
      - {name: tax, label: tax, description: the jurisdiction's part of the tax, type: money, required: true}
