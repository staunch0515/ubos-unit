# The statement lines by statement and line (STD-TIME-021).
changes:
  - op: create
    class: Projection
    object_id: 01890a5d-ac96-7f00-8000-000000000009
    slug: bank-lines
    body:
      name: bank-lines
      source: BankStatementLine
      group_by: [bank_account, statement, line]
      aggregates:
        - {fn: sum, field: amount, as: amount}
        - {fn: last, field: date, as: date}
        - {fn: last, field: reference, as: reference}
        - {fn: last, field: description, as: description}
  # the manual matches in force: the latest record of each line (FIN-BK-006)
  - op: create
    class: Projection
    object_id: 01890a5d-ac96-7f00-8000-00000000000d
    slug: bank-matches
    body:
      name: bank-matches
      source: BankMatch
      group_by: [reconciliation, line]
      aggregates:
        - {fn: last, field: action, as: action}
        - {fn: last, field: documents, as: documents}
