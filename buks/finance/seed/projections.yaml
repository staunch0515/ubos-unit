# The balance of every account (STD-TIME-021): the trial balance at any date is a read of
# this projection with asof.
changes:
  - op: create
    class: Projection
    object_id: 01890a5d-ac96-7f00-8000-000000000001
    slug: gl-balance
    body:
      name: gl-balance
      source: JournalLine
      group_by: [account]
      aggregates:
        - {fn: sum, field: amount, as: balance}
        - {fn: count, as: entries}
  # the lines of each document by account: the journal report and drill-down (FIN-RP-006, -008)
  - op: create
    class: Projection
    object_id: 01890a5d-ac96-7f00-8000-000000000002
    slug: gl-document
    body:
      name: gl-document
      source: JournalLine
      group_by: [document, account]
      aggregates:
        - {fn: sum, field: amount, as: amount}
  # the lines of each account by document kind: exclusions of the cash-flow statement
  - op: create
    class: Projection
    object_id: 01890a5d-ac96-7f00-8000-000000000003
    slug: gl-kind
    body:
      name: gl-kind
      source: JournalLine
      group_by: [account, kind]
      aggregates:
        - {fn: sum, field: amount, as: amount}
  # debits and credits per account (FIN-RP-001) and the lines of an account by document
  # (FIN-GL-022; PH-2 step 10g-3, DEC-155)
  - op: create
    class: Projection
    object_id: 01890a5d-ac96-7f00-8000-00000000000e
    slug: gl-sides
    body:
      name: gl-sides
      source: JournalLine
      group_by: [account, side]
      aggregates:
        - {fn: sum, field: amount, as: amount}
  - op: create
    class: Projection
    object_id: 01890a5d-ac96-7f00-8000-00000000000f
    slug: gl-lines
    body:
      name: gl-lines
      source: JournalLine
      group_by: [account, document]
      aggregates:
        - {fn: sum, field: amount, as: amount}
        - {fn: last, field: date, as: date}
        - {fn: last, field: kind, as: kind}
        - {fn: last, field: description, as: description}
  - op: create
    class: GeneralLedger
    object_id: 01890a5d-ac96-7f03-8000-000000000001
    slug: general-ledger
    body:
      name: General ledger
