# Receivables and sales tax (FIN-AR-002…010, FIN-TX-002…008, FIN-GL-021, FIN-RP-007; PH-2 step
# 10b, DEC-148). Every document posts through a JournalEntry of source `receivables`.
assets:
  - name: ubos.finance.receivables
    abi: "1.0"
    tier: l2
    profile: standard
    state: committed
    capabilities: [read, commit, run, search]
    exports: [post_invoice, post_receipt, reapply, aging, tax_report, statement, revalue, fx_report, post_write_off, allowance, run_recurring, void_invoice, refund]
    source: |
      fn d(v) { dec(v.to_string()) }
      fn two(x) {
        let s = x.to_string();
        if !s.contains(".") { return s + ".00"; }
        let p = s.split(".");
        let f = p[1];
        if f.len() == 1 { f += "0"; }
        if f.len() > 2 { f = f.sub_string(0, 2); }
        let out = p[0] + "." + f;
        if out == "-0.00" { "0.00" } else { out }
      }
      fn usd(x, cur) { #{amount: two(x), currency: cur} }
      fn num(s) {
        let n = 0;
        for c in s.chars() { n = n * 10 + "0123456789".index_of(c); }
        n
      }
      // days from 0000-03-01 (civil calendar)
      fn days(s) {
        let y = num(s.sub_string(0, 4));
        let m = num(s.sub_string(5, 2));
        let dd = num(s.sub_string(8, 2));
        if m <= 2 { y -= 1; }
        let era = y / 400;
        let yoe = y - era * 400;
        let mp = (m + 9) % 12;
        let doy = (153 * mp + 2) / 5 + dd - 1;
        era * 146097 + yoe * 365 + yoe / 4 - yoe / 100 + doy
      }
      fn date_of(z) {
        let era = z / 146097;
        let doe = z - era * 146097;
        let yoe = (doe - doe / 1460 + doe / 36524 - doe / 146096) / 365;
        let y = yoe + era * 400;
        let doy = doe - (365 * yoe + yoe / 4 - yoe / 100);
        let mp = (5 * doy + 2) / 153;
        let dd = doy - (153 * mp + 2) / 5 + 1;
        let m = if mp < 10 { mp + 3 } else { mp - 9 };
        if m <= 2 { y += 1; }
        let ms = if m < 10 { "0" + m.to_string() } else { m.to_string() };
        let ds = if dd < 10 { "0" + dd.to_string() } else { dd.to_string() };
        y.to_string() + "-" + ms + "-" + ds
      }
      // the last day of a date's month
      fn month_end(s) {
        let y = num(s.sub_string(0, 4));
        let m = num(s.sub_string(5, 2));
        let ny = if m == 12 { y + 1 } else { y };
        let nm = if m == 12 { 1 } else { m + 1 };
        let ms = if nm < 10 { "0" + nm.to_string() } else { nm.to_string() };
        date_of(days(ny.to_string() + "-" + ms + "-01") - 1)
      }
      // the due date under net days from the date or from the end of its month (FIN-AR-002)
      fn due_of(date, net, eom) {
        let base = if eom == true { month_end(date) } else { date };
        date_of(days(base) + net)
      }
      fn bucket(late) {
        if late <= 0 { "Current" } else if late <= 30 { "1–30" } else if late <= 60 { "31–60" }
        else if late <= 90 { "61–90" } else { "Over 90" }
      }
      fn sum_of(values, name) {
        let t = dec("0.00");
        for m in values[name] { t += dec(m.amount); }
        t
      }
      fn code_of(uri) { let p = uri.split("/"); p[p.len() - 1] }
      fn sorted(rows, key) {
        let out = [];
        for r in rows {
          let i = 0;
          while i < out.len() && out[i][key] <= r[key] { i += 1; }
          out.insert(i, r);
        }
        out
      }

      // multi-currency (FIN-FX; PH-2 step 10f, DEC-152): amounts in the functional currency
      // are the document amounts at the rate, rounded half-even to the cent as fx_convert
      // does (STD-FND-029)
      fn fx(x, rate) { round(x * rate, 2, "half_even") }
      fn rate_where(base, quote, rt) {
        "this.base == \"" + base + "\" and this.quote == \"" + quote + "\" and this.rate_type == \"" + rt + "\""
      }
      // the rate of the FxRate segment valid at a date
      fn rate_in(segs, date, what) {
        let r = ();
        for s in segs {
          if s.from <= date && (s.to == () || s.to > date) { r = s.fields.rate; }
        }
        if r == () { throw #{code: "RULE.VALIDATION_FAILED", message: "no " + what + " rate at " + date}; }
        d(r)
      }
      fn with_original(line, x, cur, fc) {
        if cur != fc { line.original = usd(x, cur); }
        line
      }
      // the functional amount of part of an open item: its carrying amount in proportion
      fn carrying(open_f, open_o, x) {
        if open_o == x { open_f } else if open_o.is_zero() { x } else { div(open_f * x, open_o, 2, "half_even") }
      }

      // an invoice or credit memo: tax per code on the sum of its lines, the journal entry,
      // the open item, the tax detail and the document's number; a foreign-currency document
      // keeps both amounts on every line (FIN-FX-003)
      fn post_invoice() {
        if this.state == "posted" { return #{posted: false, reason: "already posted"}; }
        sys.read.get(#{target: self_id});
        let cust = sys.read.get(#{target: this.customer}).fields;
        let rq = sys.search.query(#{query: #{from: "Receivables"}});
        let rl = rq.items;
        let rcv = sys.read.get(#{target: rl[0]}).fields;
        let fc = rcv.functional_currency;
        let cm = this.kind == "credit_memo";
        let sign = if cm { -1 } else { 1 };
        if cust.status == "inactive" { throw #{code: "RULE.VALIDATION_FAILED", message: "the customer " + cust.code + " is inactive"}; }
        // quantity times unit price gives the amount of a line (FIN-AR-003)
        for l in this.lines {
          if "quantity" in l && "unit_price" in l {
            let x = round(d(l.quantity) * d(l.unit_price.amount), 2, "half_up");
            if x != d(l.amount.amount) { throw #{code: "RULE.VALIDATION_FAILED", message: "the amount of a line is not its quantity times its unit price"}; }
          }
        }
        let cur = if this.currency == () { cust.currency } else { this.currency };
        let rate = dec("1");
        if cur != fc {
          if this.rate != () { rate = d(this.rate); } else {
            let fq = sys.search.query(#{query: #{from: "FxRate", where: rate_where(cur, fc, rcv.rate_type)}});
            let ids = fq.items;
            if ids.len() != 1 { throw #{code: "RULE.VALIDATION_FAILED", message: "no single " + rcv.rate_type + " rate " + cur + "/" + fc}; }
            let segs = sys.read.timeline(#{target: ids[0], valid_from: this.invoice_date,
                                           valid_to: date_of(days(this.invoice_date) + 1)}).segments;
            rate = rate_in(segs, this.invoice_date, cur + "/" + fc);
          }
        }
        let lines = [];
        let net = #{};
        let codes = [];
        let total = dec("0.00");
        let ftotal = dec("0.00");
        for l in this.lines {
          let a = d(l.amount.amount);
          let fa = fx(a, rate);
          lines.push(with_original(#{account: l.account, amount: usd(-fa * sign, fc)}, -a * sign, cur, fc));
          total += a;
          ftotal += fa;
          if !(l.tax_code in net) { net[l.tax_code] = dec("0.00"); codes.push(l.tax_code); }
          net[l.tax_code] = net[l.tax_code] + a;
        }
        let tax_total = dec("0.00");
        let tax_lines = [];
        // the tax date: the invoice's, or for a credit memo applied to an invoice the original
        // invoice's, so that a return is taxed at the rate of the sale (FIN-TX-005)
        let tax_date = this.invoice_date;
        if cm && this.applies_to != () {
          let og = sys.read.projection(#{projection: "ar-open", group: #{customer: cust.code, document: this.applies_to}}).groups;
          if og.len() > 0 { tax_date = og[0].values.invoice_date; }
        }
        for uri in codes {
          // the version of the code valid on the tax date (FIN-TX-001)
          let ts = sys.read.timeline(#{target: uri, valid_from: tax_date, valid_to: date_of(days(tax_date) + 1)}).segments;
          let tc = ();
          for s in ts { if s.from <= tax_date && (s.to == () || s.to > tax_date) { tc = s.fields; } }
          if tc == () { throw #{code: "RULE.VALIDATION_FAILED", message: "no tax code " + uri + " on " + tax_date}; }
          let trate = d(tc.rate);
          let base = net[uri];
          // half away from zero to the cent (FIN-TX-003)
          let tax = div(base * trate, 100, 2, "half_up");
          let ftax = fx(tax, rate);
          // the tax by jurisdiction, in proportion to the components' rates (FIN-TX-001)
          let parts = [];
          if tc.components != () && !ftax.is_zero() {
            let sum_rates = dec("0");
            for c in tc.components { sum_rates += d(c.rate); }
            if sum_rates != trate { throw #{code: "RULE.VALIDATION_FAILED", message: "the components of " + tc.code + " do not add up to its rate"}; }
            let left = ftax;
            for i in 0..tc.components.len() {
              let c = tc.components[i];
              let x = if i == tc.components.len() - 1 { left } else { div(ftax * d(c.rate), trate, 2, "half_up") };
              left -= x;
              let p = c.jurisdiction.split("/");
              parts.push(#{jurisdiction: p[p.len() - 1].to_upper(), tax: x});
            }
          }
          if !tax.is_zero() {
            lines.push(with_original(#{account: tc.payable_account, amount: usd(-ftax * sign, fc)}, -tax * sign, cur, fc));
          }
          let fbase = fx(base, rate);
          let taxable = if tc.category == "taxable" { fbase } else { dec("0.00") };
          let exempt = if tc.category == "taxable" { dec("0.00") } else { fbase };
          tax_lines.push(#{code: tc.code, taxable: taxable, exempt: exempt, tax: ftax, parts: parts});
          tax_total += tax;
          ftotal += ftax;
        }
        let gross = total + tax_total;
        lines.insert(0, with_original(#{account: cust.receivable_account, amount: usd(ftotal * sign, fc)}, gross * sign, cur, fc));
        // the terms: net days, from the end of the month, and an early-payment discount (FIN-AR-002)
        let net = cust.terms_days;
        let eom = false;
        let disc_days = ();
        let disc_pct = ();
        if cust.terms != () {
          let pt = sys.read.get(#{target: cust.terms}).fields;
          net = pt.net_days;
          eom = pt.end_of_month == true;
          disc_days = pt.discount_days;
          disc_pct = pt.discount_percent;
        }
        let due = if this.due_date == () { due_of(this.invoice_date, net, eom) } else { this.due_date };
        // the open item: an invoice opens one, a credit memo reduces the invoice it applies to
        let item = this.number;
        let item_date = this.invoice_date;
        let item_due = due;
        if cm && this.applies_to != () {
          item = this.applies_to;
          let g = sys.read.projection(#{projection: "ar-open", group: #{customer: cust.code, document: item}}).groups;
          if g.len() > 0 { item_date = g[0].values.invoice_date; item_due = g[0].values.due; }
        }
        // the credit limit: a warning, or a refusal unless a controller approves an override
        // (FIN-AR-013)
        let warning = ();
        if !cm && cust.credit_limit != () {
          let owed = dec("0.00");
          for g in sys.read.projection(#{projection: "ar-open"}).groups {
            if g.key.customer == cust.code { owed += sum_of(g.values, "open"); }
          }
          let limit = d(cust.credit_limit.amount);
          if owed + ftotal > limit {
            warning = "the open items of " + two(owed) + " and this invoice exceed the credit limit of " + two(limit);
            if cust.credit_action == "approve" && this.credit_override == () {
              throw #{code: "RULE.VALIDATION_FAILED", message: warning + ": a credit override approved by a controller is needed"};
            }
          }
        }
        let kind = if cm { "credit memo" } else { "invoice" };
        let e = sys.commit.create(#{class: "JournalEntry", slug: this.number.to_lower(),
          fields: #{number: this.number, source: "receivables", kind: kind, posting_date: this.invoice_date,
                    document_date: this.invoice_date, description: this.description, party: cust.code,
                    lines: lines, total: usd(ftotal, fc), state: "draft"}});
        sys.run.port(#{target: e.object_id, port: "post", params: #{}});
        sys.commit.append(#{class: "ArItem", ledger_key: #{customer: cust.code}, valid_at: this.invoice_date,
          fields: #{customer: cust.code, document: item, amount: usd(ftotal * sign, fc), original: usd(gross * sign, cur),
                    kind: this.kind, source: this.number, invoice_date: item_date, due: item_due}});
        for t in tax_lines {
          sys.commit.append(#{class: "TaxLine", ledger_key: #{tax_code: t.code}, valid_at: this.invoice_date,
            fields: #{tax_code: t.code, document: this.number, customer: cust.code,
                      taxable: usd(t.taxable * sign, fc), exempt: usd(t.exempt * sign, fc), tax: usd(t.tax * sign, fc)}});
          for pt in t.parts {
            sys.commit.append(#{class: "TaxPart", ledger_key: #{tax_code: t.code}, valid_at: this.invoice_date,
              fields: #{tax_code: t.code, jurisdiction: pt.jurisdiction, document: this.number, tax: usd(pt.tax * sign, fc)}});
          }
        }
        sys.commit.append(#{class: "PostingNumber",
          ledger_key: #{fiscal_year: this.invoice_date.sub_string(0, 4), source: "sales-documents"},
          valid_at: this.invoice_date,
          fields: #{fiscal_year: this.invoice_date.sub_string(0, 4), source: "sales-documents", entry: self_id, count: dec("1")}});
        let set = #{state: "posted", due_date: due, tax: usd(tax_total, cur), total: usd(gross, cur),
                    functional_total: usd(ftotal, fc)};
        if !cm && disc_days != () && disc_pct != () {
          set.discount_date = date_of(days(this.invoice_date) + disc_days);
          set.discount = usd(div(gross * d(disc_pct), 100, 2, "half_up"), cur);
        }
        if cur != fc { set.currency = cur; set.rate = rate.to_string(); }
        sys.commit.update(#{target: self_id, set: set});
        let out = #{posted: true, number: this.number, tax: two(tax_total), total: two(gross), currency: cur,
                    rate: rate.to_string(), functional_total: two(ftotal), due_date: due};
        if warning != () { out.warning = warning; }
        out
      }

      // a receipt: cash against receivables; applications reduce open items at their carrying
      // amount, the rest stays unapplied (FIN-AR-007, -008); a foreign-currency receipt is
      // converted at its date and the difference to the carrying amount is the realized gain
      // or loss (FIN-FX-004)
      fn post_receipt() {
        if this.state == "posted" { return #{posted: false, reason: "already posted"}; }
        sys.read.get(#{target: self_id});
        let cust = sys.read.get(#{target: this.customer}).fields;
        let rq = sys.search.query(#{query: #{from: "Receivables"}});
        let rl = rq.items;
        let rcv = sys.read.get(#{target: rl[0]}).fields;
        let fc = rcv.functional_currency;
        let cur = currency(this.amount);
        let a = amount(this.amount);
        let rate = dec("1");
        if cur != fc {
          if this.rate != () { rate = d(this.rate); } else {
            let fq = sys.search.query(#{query: #{from: "FxRate", where: rate_where(cur, fc, rcv.rate_type)}});
            let ids = fq.items;
            if ids.len() != 1 { throw #{code: "RULE.VALIDATION_FAILED", message: "no single " + rcv.rate_type + " rate " + cur + "/" + fc}; }
            let segs = sys.read.timeline(#{target: ids[0], valid_from: this.receipt_date,
                                           valid_to: date_of(days(this.receipt_date) + 1)}).segments;
            rate = rate_in(segs, this.receipt_date, cur + "/" + fc);
          }
        }
        let fa = fx(a, rate);
        let rest = a;
        let credited = dec("0.00");
        let discounts = dec("0.00");
        let items = [];
        let gains = [];
        let apps = if this.applications == () { [] } else { this.applications };
        for app in apps {
          let g = sys.read.projection(#{projection: "ar-open", group: #{customer: cust.code, document: app.document}}).groups;
          if g.len() == 0 { throw #{code: "RULE.VALIDATION_FAILED", message: "no open item " + app.document}; }
          let x = d(app.amount.amount);
          let c = carrying(sum_of(g[0].values, "open"), sum_of(g[0].values, "original"), x);
          // an early-payment discount taken by the discount date (FIN-AR-002)
          let disc = dec("0.00");
          if "discount" in app && app.discount != () {
            disc = d(app.discount.amount);
            if cur != fc { throw #{code: "RULE.VALIDATION_FAILED", message: "a discount is taken in the functional currency"}; }
            let iq = sys.search.query(#{query: #{from: "Invoice", where: "this.number == \"" + app.document + "\""}});
            let inv = iq.items;
            if inv.len() == 0 { throw #{code: "RULE.VALIDATION_FAILED", message: "no invoice " + app.document + " to take a discount on"}; }
            let f = sys.read.get(#{target: inv[0]}).fields;
            if f.discount_date == () || this.receipt_date > f.discount_date { throw #{code: "RULE.VALIDATION_FAILED", message: "the discount of " + app.document + " has expired"}; }
            if disc > d(f.discount.amount) { throw #{code: "RULE.VALIDATION_FAILED", message: "the discount exceeds the one offered on " + app.document}; }
            if rcv.discount_account == () { throw #{code: "RULE.VALIDATION_FAILED", message: "the receivables have no discount account"}; }
            discounts += disc;
          }
          items.push(#{document: app.document, functional: c + disc, original: x + disc,
                       invoice_date: g[0].values.invoice_date, due: g[0].values.due});
          let loss = c - fx(x, rate);
          if !loss.is_zero() { gains.push(#{document: app.document, amount: loss}); }
          credited += c + disc;
          rest -= x;
        }
        let frest = fa - fx(a - rest, rate);
        credited += frest;
        let loss_total = credited - fa - discounts;
        let lines = [with_original(#{account: this.bank_account, amount: usd(fa, fc)}, a, cur, fc)];
        if !discounts.is_zero() { lines.push(#{account: rcv.discount_account, amount: usd(discounts, fc)}); }
        if !loss_total.is_zero() {
          lines.push(#{account: rcv.realized_account, amount: usd(loss_total, fc)});
        }
        lines.push(with_original(#{account: cust.receivable_account, amount: usd(-credited, fc)}, -a, cur, fc));
        let debits = fa + discounts;
        if loss_total > 0 { debits += loss_total; }
        let e = sys.commit.create(#{class: "JournalEntry", slug: this.number.to_lower(),
          fields: #{number: this.number, source: "receivables", kind: "receipt", posting_date: this.receipt_date,
                    document_date: this.receipt_date, description: "Receipt " + this.number, party: cust.code,
                    lines: lines, total: usd(debits, fc), state: "draft"}});
        sys.run.port(#{target: e.object_id, port: "post", params: #{}});
        for it in items {
          sys.commit.append(#{class: "ArItem", ledger_key: #{customer: cust.code}, valid_at: this.receipt_date,
            fields: #{customer: cust.code, document: it.document, amount: usd(-it.functional, fc),
                      original: usd(-it.original, cur), kind: "receipt", source: this.number,
                      invoice_date: it.invoice_date, due: it.due}});
        }
        for gl in gains {
          sys.commit.append(#{class: "FxGain", ledger_key: #{document: gl.document}, valid_at: this.receipt_date,
            fields: #{document: gl.document, customer: cust.code, kind: "realized", source: this.number,
                      amount: usd(gl.amount, fc), rate: rate.to_string()}});
        }
        if !rest.is_zero() {
          sys.commit.append(#{class: "ArItem", ledger_key: #{customer: cust.code}, valid_at: this.receipt_date,
            fields: #{customer: cust.code, document: "UNAPPLIED-" + this.number, amount: usd(-frest, fc),
                      original: usd(-rest, cur), kind: "receipt", source: this.number,
                      invoice_date: this.receipt_date, due: this.receipt_date}});
        }
        let set = #{state: "posted", functional_amount: usd(fa, fc)};
        if cur != fc { set.rate = rate.to_string(); }
        sys.commit.update(#{target: self_id, set: set});
        #{posted: true, number: this.number, unapplied: two(rest), currency: cur, rate: rate.to_string(),
          functional_amount: two(fa), realized: two(loss_total)}
      }

      fn reapply(from_document, to_document, amount) {
        sys.read.get(#{target: self_id});
        let cust = sys.read.get(#{target: this.customer}).fields;
        let x = d(amount.amount);
        let cur = amount.currency;
        let today = this.receipt_date;
        for pair in [[from_document, x], [to_document, -x]] {
          let g = sys.read.projection(#{projection: "ar-open", group: #{customer: cust.code, document: pair[0]}}).groups;
          if g.len() == 0 { throw #{code: "RULE.VALIDATION_FAILED", message: "no open item " + pair[0]}; }
          let o = sum_of(g[0].values, "original");
          let f = carrying(sum_of(g[0].values, "open"), o, x);
          let fcur = g[0].values.open[0].currency;
          let ocur = g[0].values.original[0].currency;
          if ocur != cur { throw #{code: "RULE.VALIDATION_FAILED", message: "the amount is not in the currency of " + pair[0]}; }
          let sgn = if pair[1] < 0 { -1 } else { 1 };
          sys.commit.append(#{class: "ArItem", ledger_key: #{customer: cust.code}, valid_at: today,
            fields: #{customer: cust.code, document: pair[0], amount: usd(f * sgn, fcur), original: usd(pair[1], cur),
                      kind: "reapply", source: this.number, invoice_date: g[0].values.invoice_date, due: g[0].values.due}});
        }
        #{reapplied: two(x), from: from_document, to: to_document}
      }

      // the open items in the functional currency and in the document currency (FIN-FX-007)
      fn aging(as_of) {
        let groups = sys.read.projection(#{projection: "ar-open", asof: as_of}).groups;
        let control = sys.read.projection(#{projection: "gl-balance", asof: as_of,
                                            group: #{account: this.control_account}}).groups;
        let rows = [];
        let total = dec("0.00");
        for g in groups {
          let open = sum_of(g.values, "open");
          if open.is_zero() { continue; }
          rows.push(#{customer: g.key.customer, document: g.key.document, date: g.values.invoice_date,
                      due: g.values.due, bucket: bucket(days(as_of) - days(g.values.due)), open: two(open),
                      currency: g.values.original[0].currency, original: two(sum_of(g.values, "original"))});
          total += open;
        }
        let c = if control.len() > 0 { sum_of(control[0].values, "balance") } else { dec("0.00") };
        #{as_of: as_of, rows: sorted(rows, "document"), total: two(total), control_balance: two(c),
          difference: two(total - c)}
      }

      fn tax_report(opening, closing) {
        let g0 = sys.read.projection(#{projection: "tax-detail", asof: opening}).groups;
        let g1 = sys.read.projection(#{projection: "tax-detail", asof: closing}).groups;
        let before = #{};
        for g in g0 { before[g.key.tax_code + "|" + g.key.document] = g.values; }
        let by = #{};
        let codes = [];
        for g in g1 {
          let k = g.key.tax_code + "|" + g.key.document;
          let t = sum_of(g.values, "taxable");
          let x = sum_of(g.values, "exempt");
          let tax = sum_of(g.values, "tax");
          if k in before {
            t -= sum_of(before[k], "taxable");
            x -= sum_of(before[k], "exempt");
            tax -= sum_of(before[k], "tax");
          }
          if t.is_zero() && x.is_zero() && tax.is_zero() { continue; }
          let c = g.key.tax_code;
          if !(c in by) { by[c] = #{taxable: dec("0.00"), exempt: dec("0.00"), tax: dec("0.00"), documents: []}; codes.push(c); }
          let r = by[c];
          r.taxable += t; r.exempt += x; r.tax += tax; r.documents.push(g.key.document);
          by[c] = r;
        }
        // the tax by jurisdiction of the period (FIN-TX-001)
        let p0 = #{};
        for g in sys.read.projection(#{projection: "tax-parts", asof: opening}).groups {
          p0[g.key.tax_code + "|" + g.key.jurisdiction + "|" + g.key.document] = sum_of(g.values, "tax");
        }
        let parts = #{};
        for g in sys.read.projection(#{projection: "tax-parts", asof: closing}).groups {
          let k = g.key.tax_code + "|" + g.key.jurisdiction + "|" + g.key.document;
          let x = sum_of(g.values, "tax");
          if k in p0 { x -= p0[k]; }
          let pk = g.key.tax_code + "|" + g.key.jurisdiction;
          if !(pk in parts) { parts[pk] = dec("0.00"); }
          parts[pk] = parts[pk] + x;
        }
        let rows = [];
        for c in codes {
          let r = by[c];
          let row = #{tax_code: c, taxable: two(r.taxable), exempt: two(r.exempt), tax: two(r.tax), documents: r.documents};
          let ps = [];
          for pk in parts.keys() {
            let s = pk.split("|");
            if s[0] == c && !parts[pk].is_zero() { ps.push(#{jurisdiction: s[1], tax: two(parts[pk])}); }
          }
          if ps.len() > 0 { row.parts = sorted(ps, "jurisdiction"); }
          rows.push(row);
        }
        #{opening: opening, closing: closing, rows: sorted(rows, "tax_code")}
      }

      fn statement(customer, opening, closing) {
        let g0 = sys.read.projection(#{projection: "ar-activity", asof: opening, group: #{customer: customer}}).groups;
        let g1 = sys.read.projection(#{projection: "ar-activity", asof: closing, group: #{customer: customer}}).groups;
        let start = dec("0.00");
        for g in g0 { start += sum_of(g.values, "amount"); }
        let kinds = #{};
        let end = dec("0.00");
        for g in g1 { end += sum_of(g.values, "amount"); kinds[g.key.kind] = sum_of(g.values, "amount"); }
        for g in g0 { kinds[g.key.kind] = kinds[g.key.kind] - sum_of(g.values, "amount"); }
        let k = #{};
        for n in kinds.keys() { if !kinds[n].is_zero() { k[n] = two(kinds[n]); } }
        #{customer: customer, opening_balance: two(start), activity: k, closing_balance: two(end)}
      }

      // the period-end remeasurement of the open foreign-currency items at the rate of the
      // period end: FXR-<yymm> posts the unrealized gain or loss and reverses on the next day
      // (through FiscalPeriod.open); the subledger and the gain ledger record the reversal at
      // the same date. A simulation computes the run and its difference to the posted entry
      // without posting; the posted run is reproduced by simulating it on its snapshot
      // (FIN-FX-005)
      fn revalue(period_end, simulate) {
        sys.read.get(#{target: self_id});
        let sim = simulate == true;
        let fc = this.functional_currency;
        let number = "FXR-" + period_end.sub_string(2, 2) + period_end.sub_string(5, 2);
        let eq = sys.search.query(#{query: #{from: "JournalEntry", where: "this.number == \"" + number + "\""}});
        let existing = eq.items;
        if !sim && existing.len() > 0 { return #{posted: false, reason: "already posted", number: number}; }
        if !sim {
          let pw = "this.start <= d'" + period_end + "' and this.end > d'" + period_end + "'";
          for id in sys.search.query(#{query: #{from: "FiscalPeriod", where: pw}}).items {
            if sys.read.get(#{target: id}).fields.state == "closed" { throw #{code: "LEDG.PERIOD_CLOSED", message: "the period of " + period_end + " is closed"}; }
          }
        }
        let groups = sys.read.projection(#{projection: "ar-open", asof: period_end}).groups;
        let rates = #{};
        let items = [];
        let total = dec("0.00");
        let parties = [];
        for g in groups {
          let o = sum_of(g.values, "original");
          if o.is_zero() { continue; }
          let cur = g.values.original[0].currency;
          if cur == fc { continue; }
          if !(cur in rates) {
            let fq = sys.search.query(#{query: #{from: "FxRate", where: rate_where(cur, fc, this.rate_type)}});
            let ids = fq.items;
            if ids.len() != 1 { throw #{code: "RULE.VALIDATION_FAILED", message: "no single " + this.rate_type + " rate " + cur + "/" + fc}; }
            let segs = sys.read.timeline(#{target: ids[0], valid_from: period_end,
                                           valid_to: date_of(days(period_end) + 1)}).segments;
            rates[cur] = rate_in(segs, period_end, cur + "/" + fc);
          }
          let f = sum_of(g.values, "open");
          // a simulation of a posted run starts from the carrying amount before that run
          if existing.len() > 0 {
            let pg = sys.read.projection(#{projection: "fx-gains", asof: period_end,
              group: #{document: g.key.document, kind: "unrealized", source: number}}).groups;
            if pg.len() > 0 { f += sum_of(pg[0].values, "amount"); }
          }
          let target = fx(o, rates[cur]);
          let diff = target - f;
          if diff.is_zero() { continue; }
          items.push(#{customer: g.key.customer, document: g.key.document, currency: cur, original: two(o),
                       rate: rates[cur].to_string(), carrying: two(f), remeasured: two(target), difference: two(diff),
                       due: g.values.due, invoice_date: g.values.invoice_date, diff: diff});
          total += diff;
          if !parties.contains(g.key.customer) { parties.push(g.key.customer); }
        }
        let out_items = [];
        for it in items {
          out_items.push(#{customer: it.customer, document: it.document, currency: it.currency, original: it.original,
                           rate: it.rate, carrying: it.carrying, remeasured: it.remeasured, difference: it.difference});
        }
        if sim {
          let posted = ();
          if existing.len() > 0 {
            let pe = sys.read.get(#{target: existing[0]}).fields;
            let p = dec("0.00");
            for l in pe.lines { if l.account == this.control_account { p += d(l.amount.amount); } }
            posted = p;
          }
          let r = #{simulated: true, number: number, period_end: period_end, items: out_items, total: two(total)};
          if posted != () { r.posted = two(posted); r.difference = two(total - posted); }
          return r;
        }
        if items.len() == 0 { return #{posted: false, reason: "nothing to remeasure", number: number}; }
        let reverse_on = date_of(days(period_end) + 1);
        let lines = [#{account: this.control_account, amount: usd(total, fc)},
                     #{account: this.unrealized_account, amount: usd(-total, fc)}];
        let debit = if total > 0 { total } else { -total };
        let fields = #{number: number, source: "revaluation", kind: "revaluation", posting_date: period_end,
                       document_date: period_end, description: "Remeasure open foreign-currency receivables at " + period_end,
                       lines: lines, total: usd(debit, fc), auto_reverse_on: reverse_on, state: "draft"};
        if parties.len() == 1 { fields.party = parties[0]; }
        let e = sys.commit.create(#{class: "JournalEntry", slug: number.to_lower(), fields: fields});
        sys.run.port(#{target: e.object_id, port: "post", params: #{}});
        for it in items {
          for pair in [[period_end, it.diff, number], [reverse_on, -it.diff, number + "-R"]] {
            sys.commit.append(#{class: "ArItem", ledger_key: #{customer: it.customer}, valid_at: pair[0],
              fields: #{customer: it.customer, document: it.document, amount: usd(pair[1], fc),
                        original: usd(dec("0.00"), it.currency), kind: "revaluation", source: pair[2],
                        invoice_date: it.invoice_date, due: it.due}});
            sys.commit.append(#{class: "FxGain", ledger_key: #{document: it.document}, valid_at: pair[0],
              fields: #{document: it.document, customer: it.customer, kind: "unrealized", source: pair[2],
                        amount: usd(-pair[1], fc), rate: it.rate}});
          }
        }
        #{posted: true, number: number, reverses_on: reverse_on, items: out_items, total: two(total)}
      }

      // realized and unrealized gains (negative) and losses (positive) by document and the
      // entry that posted them, in a period
      fn fx_report(opening, closing) {
        let g0 = sys.read.projection(#{projection: "fx-gains", asof: opening}).groups;
        let g1 = sys.read.projection(#{projection: "fx-gains", asof: closing}).groups;
        let before = #{};
        for g in g0 { before[g.key.document + "|" + g.key.kind + "|" + g.key.source] = sum_of(g.values, "amount"); }
        let rows = [];
        let realized = dec("0.00");
        let unrealized = dec("0.00");
        for g in g1 {
          let k = g.key.document + "|" + g.key.kind + "|" + g.key.source;
          let x = sum_of(g.values, "amount");
          if k in before { x -= before[k]; }
          if x.is_zero() { continue; }
          rows.push(#{document: g.key.document, kind: g.key.kind, source: g.key.source, amount: two(x), key: k});
          if g.key.kind == "realized" { realized += x; } else { unrealized += x; }
        }
        let out = [];
        for r in sorted(rows, "key") { out.push(#{document: r.document, kind: r.kind, source: r.source, amount: r.amount}); }
        #{opening: opening, closing: closing, rows: out, realized: two(realized), unrealized: two(unrealized)}
      }

      // a write-off against the allowance, or a recovery that reinstates the item before it is
      // received (FIN-AR-012)
      fn post_write_off() {
        if this.state == "posted" { return #{posted: false, reason: "already posted"}; }
        sys.read.get(#{target: self_id});
        let cust = sys.read.get(#{target: this.customer}).fields;
        let rq = sys.search.query(#{query: #{from: "Receivables"}});
        let rl = rq.items;
        let rcv = sys.read.get(#{target: rl[0]}).fields;
        if rcv.allowance_account == () { throw #{code: "RULE.VALIDATION_FAILED", message: "the receivables have no allowance account"}; }
        let a = amount(this.amount);
        let cur = currency(this.amount);
        if cur != rcv.functional_currency { throw #{code: "RULE.VALIDATION_FAILED", message: "a write-off is in the functional currency"}; }
        let g = sys.read.projection(#{projection: "ar-open", group: #{customer: cust.code, document: this.document}}).groups;
        let off = this.kind == "write_off";
        if off && (g.len() == 0 || sum_of(g[0].values, "open") < a) {
          throw #{code: "RULE.VALIDATION_FAILED", message: this.document + " has no open amount of " + two(a)};
        }
        let sign = if off { -1 } else { 1 };
        let e = sys.commit.create(#{class: "JournalEntry", slug: this.number.to_lower(),
          fields: #{number: this.number, source: "receivables", kind: if off { "write-off" } else { "recovery" },
                    posting_date: this.date, document_date: this.date, party: cust.code,
                    description: this.reason + " (" + this.document + ")",
                    lines: [#{account: rcv.allowance_account, amount: usd(-a * sign, cur)},
                            #{account: cust.receivable_account, amount: usd(a * sign, cur)}],
                    total: usd(a, cur), state: "draft"}});
        sys.run.port(#{target: e.object_id, port: "post", params: #{}});
        let item_date = if g.len() > 0 { g[0].values.invoice_date } else { this.date };
        let item_due = if g.len() > 0 { g[0].values.due } else { this.date };
        sys.commit.append(#{class: "ArItem", ledger_key: #{customer: cust.code}, valid_at: this.date,
          fields: #{customer: cust.code, document: this.document, amount: usd(a * sign, cur), original: usd(a * sign, cur),
                    kind: if off { "write_off" } else { "recovery" }, source: this.number,
                    invoice_date: item_date, due: item_due}});
        if off {
          let iq = sys.search.query(#{query: #{from: "Invoice", where: "this.number == \"" + this.document + "\""}});
          for id in iq.items {
            sys.read.get(#{target: id});
            sys.commit.update(#{target: id, set: #{written_off_on: this.date}});
          }
        }
        sys.commit.update(#{target: self_id, set: #{state: "posted"}});
        #{posted: true, number: this.number, kind: this.kind, amount: two(a)}
      }

      // the allowance the loss rates suggest on the aging at a date, against the balance of the
      // allowance account (FIN-AR-011)
      fn allowance(as_of) {
        sys.read.get(#{target: self_id});
        let ag = sys.run.port(#{target: self_id, port: "aging", params: #{as_of: as_of}});
        let rates = if this.loss_rates == () { #{} } else { this.loss_rates };
        let by = #{};
        for r in ag.rows {
          if !(r.bucket in by) { by[r.bucket] = dec("0.00"); }
          by[r.bucket] = by[r.bucket] + d(r.open);
        }
        let rows = [];
        let total = dec("0.00");
        for b in ["Current", "1–30", "31–60", "61–90", "Over 90"] {
          if !(b in by) { continue; }
          let rate = if b in rates { d(rates[b]) } else { dec("0") };
          let x = div(by[b] * rate, 100, 2, "half_up");
          rows.push(#{bucket: b, open: two(by[b]), rate: rate.to_string(), allowance: two(x)});
          total += x;
        }
        let existing = dec("0.00");
        if this.allowance_account != () {
          let gq = sys.read.projection(#{projection: "gl-balance", asof: as_of, group: #{account: this.allowance_account}});
          let gg = gq.groups;
          if gg.len() > 0 { existing = -sum_of(gg[0].values, "balance"); }
        }
        #{as_of: as_of, rows: rows, suggested: two(total), existing: two(existing), adjustment: two(total - existing)}
      }

      // the invoice of a period from a template, created and posted once (FIN-AR-014)
      fn run_recurring(period_end) {
        sys.read.get(#{target: self_id});
        if period_end < this.first_period_end || (this.last_period_end != () && period_end > this.last_period_end) {
          return #{created: false, reason: "outside the template's periods"};
        }
        let number = this.code + "-" + period_end.sub_string(0, 7);
        let q = sys.search.query(#{query: #{from: "Invoice", where: "this.number == \"" + number + "\""}});
        let found = q.items;
        if found.len() > 0 { return #{created: false, number: number}; }
        let c = sys.commit.create(#{class: "Invoice", slug: number.to_lower(),
          fields: #{number: number, kind: "invoice", customer: this.customer, invoice_date: period_end,
                    description: this.description, lines: this.lines, state: "draft"}});
        let r = sys.run.port(#{target: c.object_id, port: "post", params: #{}});
        #{created: true, number: number, total: r.total}
      }

      // the void of a posted invoice on which nothing was received: a reversing entry dated in an
      // open period, the open item and the tax detail reversed (FIN-AR-004)
      fn void_invoice(void_date, reason) {
        sys.read.get(#{target: self_id});
        if this.state != "posted" { throw #{code: "RULE.VALIDATION_FAILED", message: "only a posted invoice is voided"}; }
        if this.voided_on != () { throw #{code: "RULE.VALIDATION_FAILED", message: "the invoice is voided"}; }
        if this.kind != "invoice" { throw #{code: "RULE.VALIDATION_FAILED", message: "a credit memo is reversed by an invoice"}; }
        let cust = sys.read.get(#{target: this.customer}).fields;
        let g = sys.read.projection(#{projection: "ar-open", group: #{customer: cust.code, document: this.number}}).groups;
        if g.len() == 0 || sum_of(g[0].values, "original") != amount(this.total) {
          throw #{code: "RULE.VALIDATION_FAILED", message: "something was received or credited on " + this.number + ": issue a credit memo"};
        }
        let eq = sys.search.query(#{query: #{from: "JournalEntry", where: "this.number == \"" + this.number + "\""}});
        let es = eq.items;
        let e = sys.read.get(#{target: es[0]}).fields;
        let number = this.number + "-VOID";
        let lines = [];
        for l in e.lines {
          let n = #{account: l.account, amount: #{amount: (-dec(l.amount.amount)).to_string(), currency: l.amount.currency}};
          if "original" in l { n.original = #{amount: (-dec(l.original.amount)).to_string(), currency: l.original.currency}; }
          lines.push(n);
        }
        let v = sys.commit.create(#{class: "JournalEntry", slug: number.to_lower(),
          fields: #{number: number, source: "receivables", kind: "invoice void", posting_date: void_date,
                    document_date: void_date, description: "Void of " + this.number + ": " + reason, party: cust.code,
                    reverses: this.number, lines: lines, total: e.total, state: "draft"}});
        sys.run.port(#{target: v.object_id, port: "post", params: #{}});
        sys.commit.append(#{class: "ArItem", ledger_key: #{customer: cust.code}, valid_at: void_date,
          fields: #{customer: cust.code, document: this.number, amount: usd(-sum_of(g[0].values, "open"), g[0].values.open[0].currency),
                    original: usd(-sum_of(g[0].values, "original"), g[0].values.original[0].currency), kind: "void",
                    source: number, invoice_date: g[0].values.invoice_date, due: g[0].values.due}});
        let tq = sys.read.projection(#{projection: "tax-detail"}).groups;
        for t in tq {
          if t.key.document != this.number { continue; }
          sys.commit.append(#{class: "TaxLine", ledger_key: #{tax_code: t.key.tax_code}, valid_at: void_date,
            fields: #{tax_code: t.key.tax_code, document: this.number, customer: cust.code,
                      taxable: usd(-sum_of(t.values, "taxable"), t.values.taxable[0].currency),
                      exempt: usd(-sum_of(t.values, "exempt"), t.values.exempt[0].currency),
                      tax: usd(-sum_of(t.values, "tax"), t.values.tax[0].currency)}});
        }
        sys.commit.update(#{target: self_id, set: #{voided_on: void_date}});
        #{voided: this.number, entry: number}
      }

      // a refund of a customer's credit from a bank account (FIN-AR-006)
      fn refund(number, customer, document, amount, refund_date, bank_account) {
        sys.read.get(#{target: self_id});
        let x = d(amount.amount);
        let cur = amount.currency;
        if cur != this.functional_currency { throw #{code: "RULE.VALIDATION_FAILED", message: "a refund is in the functional currency"}; }
        let g = sys.read.projection(#{projection: "ar-open", group: #{customer: customer, document: document}}).groups;
        if g.len() == 0 || -sum_of(g[0].values, "open") < x { throw #{code: "RULE.VALIDATION_FAILED", message: document + " has no credit of " + two(x)}; }
        let cq = sys.search.query(#{query: #{from: "Customer", where: "this.code == \"" + customer + "\""}});
        let cs = cq.items;
        let cust = sys.read.get(#{target: cs[0]}).fields;
        let e = sys.commit.create(#{class: "JournalEntry", slug: number.to_lower(),
          fields: #{number: number, source: "receivables", kind: "refund", posting_date: refund_date,
                    document_date: refund_date, description: "Refund of " + document, party: customer,
                    lines: [#{account: cust.receivable_account, amount: usd(x, cur)},
                            #{account: bank_account, amount: usd(-x, cur)}],
                    total: usd(x, cur), state: "draft"}});
        sys.run.port(#{target: e.object_id, port: "post", params: #{}});
        sys.commit.append(#{class: "ArItem", ledger_key: #{customer: customer}, valid_at: refund_date,
          fields: #{customer: customer, document: document, amount: usd(x, cur), original: usd(x, cur), kind: "refund",
                    source: number, invoice_date: g[0].values.invoice_date, due: g[0].values.due}});
        #{refunded: two(x), document: document, open: two(sum_of(g[0].values, "open") + x)}
      }
