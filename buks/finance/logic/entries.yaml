# Posting journal entries (FIN-GL-010…015; PH-2 step 10a-1, DEC-146). Decisions run before
# `post` (STD-LGS-031): the sheet `ubos.finance.controls` requires approval or refuses.
assets:
  - name: ubos.finance.entries
    abi: "1.0"
    tier: l2
    profile: standard
    state: committed
    capabilities: [read, commit, search]
    exports: [post]
    source: |
      fn post() {
        if this.state == "posted" { return #{posted: false, reason: "already posted"}; }
        sys.read.get(#{target: self_id});
        // the declared total, which the approval rules read, is the sum of the debits
        let debits = dec("0.00");
        let net = dec("0.00");
        for l in this.lines {
          let a = dec(l.amount.amount);
          if a > 0 { debits += a; }
          net += a;
        }
        // debits equal credits (FIN-GL-010); the ledger checks it again when the lines commit
        if !net.is_zero() { throw #{code: "LEDG.UNBALANCED", message: "the entry does not balance: debits less credits " + net.to_string()}; }
        // a foreign-currency entry balances in each transaction currency too (FIN-GL-011)
        let by = #{};
        for l in this.lines {
          if "original" in l {
            let c = l.original.currency;
            if !(c in by) { by[c] = dec("0.00"); }
            by[c] = by[c] + dec(l.original.amount);
          }
        }
        for c in by.keys() {
          if !by[c].is_zero() { throw #{code: "LEDG.UNBALANCED", message: "the entry does not balance in " + c + ": " + by[c].to_string()}; }
        }
        // every line names an account of the chart (SCN-501 A2): an unknown one is not found
        for l in this.lines { sys.read.get(#{target: l.account}); }
        if debits != amount(this.total) {
          throw #{code: "LEDG.UNBALANCED", message: "the total " + amount(this.total).to_string() + " is not the sum of the debits " + debits.to_string()};
        }
        // the posting date must lie in a period that is not closed (FIN-PC-005): the kernel
        // checks the commit date (STD-KIND-025), the Buk the business date
        let pw = "this.start <= d'" + this.posting_date + "' and this.end > d'" + this.posting_date + "'";
        for id in sys.search.query(#{query: #{from: "FiscalPeriod", where: pw}}).items {
          let p = sys.read.get(#{target: id}).fields;
          if p.state == "closed" { throw #{code: "LEDG.PERIOD_CLOSED", message: "the period of " + this.posting_date + " is closed"}; }
          // a soft-closed period takes adjusting entries only, which a controller approves
          // (FIN-PC-003, the sheet ubos.finance.controls)
          if p.state == "closing" && this.adjusting != true {
            throw #{code: "LEDG.PERIOD_CLOSED", message: "the period of " + this.posting_date + " is soft-closed: only adjusting entries post"};
          }
          // a subledger closed for the period posts no more in it (FIN-PC-003)
          if p.closed_subledgers != () && p.closed_subledgers.contains(this.source) {
            throw #{code: "LEDG.PERIOD_CLOSED", message: "the " + this.source + " subledger is closed for the period of " + this.posting_date};
          }
        }
        let year = this.posting_date.sub_string(0, 4);
        let source = this.source;
        // the number: the next entry of the gap-free sequence of (fiscal year, source)
        sys.commit.append(#{class: "PostingNumber", ledger_key: #{fiscal_year: year, source: source},
                            valid_at: this.posting_date,
                            fields: #{fiscal_year: year, source: source, entry: self_id, count: dec("1")}});
        for l in this.lines {
          let f = #{account: l.account, amount: l.amount, document: this.number, kind: this.kind,
                    description: this.description, date: this.posting_date,
                    side: if dec(l.amount.amount) < 0 { "credit" } else { "debit" }};
          if this.party != () { f.party = this.party; }
          if "original" in l { f.original = l.original; }
          sys.commit.append(#{class: "JournalLine", ledger_key: #{account: l.account},
                              valid_at: this.posting_date, posting_group: this.number, fields: f});
        }
        sys.commit.update(#{target: self_id, set: #{state: "posted"}});
        #{posted: true, number: this.number}
      }
