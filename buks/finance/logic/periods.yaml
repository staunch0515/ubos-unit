# Periods, years and recurring entries (FIN-GL-017, -018, FIN-PC-006, -008; PH-2 step 10a-2,
# DEC-147).
assets:
  - name: ubos.finance.periods
    abi: "1.0"
    tier: l2
    profile: standard
    state: committed
    capabilities: [read, commit, run, search]
    exports: [open, reopen, checklist, soft_close, close_subledger]
    source: |
      fn num(s) {
        let n = 0;
        for c in s.chars() { n = n * 10 + "0123456789".index_of(c); }
        n
      }
      fn days(s) {
        let y = num(s.sub_string(0, 4));
        let m = num(s.sub_string(5, 2));
        let dd = num(s.sub_string(8, 2));
        if m <= 2 { y -= 1; }
        let era = y / 400;
        let yoe = y - era * 400;
        let mp = (m + 9) % 12;
        let doy = (153 * mp + 2) / 5 + dd - 1;
        era * 146097 + yoe * 365 + yoe / 4 - yoe / 100 + doy
      }
      fn date_of(z) {
        let era = z / 146097;
        let doe = z - era * 146097;
        let yoe = (doe - doe / 1460 + doe / 36524 - doe / 146096) / 365;
        let y = yoe + era * 400;
        let doy = doe - (365 * yoe + yoe / 4 - yoe / 100);
        let mp = (5 * doy + 2) / 153;
        let dd = doy - (153 * mp + 2) / 5 + 1;
        let m = if mp < 10 { mp + 3 } else { mp - 9 };
        if m <= 2 { y += 1; }
        let ms = if m < 10 { "0" + m.to_string() } else { m.to_string() };
        let ds = if dd < 10 { "0" + dd.to_string() } else { dd.to_string() };
        y.to_string() + "-" + ms + "-" + ds
      }
      fn in_period(field, start, end) {
        "this." + field + " >= d'" + start + "' and this." + field + " < d'" + end + "'"
      }
      fn check(name, failing) { #{check: name, passed: failing.len() == 0, evidence: failing} }
      fn negated(lines) {
        let out = [];
        for l in lines {
          let a = -dec(l.amount.amount);
          let n = #{account: l.account, amount: #{amount: a.to_string(), currency: l.amount.currency}};
          if "original" in l {
            n.original = #{amount: (-dec(l.original.amount)).to_string(), currency: l.original.currency};
          }
          out.push(n);
        }
        out
      }
      // the automatic reversals dated in the period, each posted once (FIN-GL-018)
      fn open() {
        sys.read.get(#{target: self_id});
        let w = "this.state == \"posted\" and this.auto_reverse_on >= d'"
                + this.start + "' and this.auto_reverse_on < d'" + this.end + "'";
        let q = sys.search.query(#{query: #{from: "JournalEntry", where: w}});
        let done = [];
        for id in q.items {
          let e = sys.read.get(#{target: id}).fields;
          let number = e.number + "-R";
          // a posted entry is frozen (STD-LGS-011, DEC-158): its reversal is found by
          // the reversing entry's `reverses`, not marked on the entry
          let rq = "this.reverses == \"" + e.number + "\"";
          let prior = sys.search.query(#{query: #{from: "JournalEntry", where: rq}}).items;
          if prior.len() > 0 { continue; }
          let f = #{number: number, source: e.source, kind: e.kind + " reversal", posting_date: e.auto_reverse_on,
                    description: "Auto-reversal of " + e.number, lines: negated(e.lines), total: e.total,
                    state: "draft", reverses: e.number};
          if e.party != () { f.party = e.party; }
          let c = sys.commit.create(#{class: "JournalEntry", slug: number.to_lower(), fields: f});
          sys.run.port(#{target: c.object_id, port: "post", params: #{}});
          done.push(number);
        }
        #{reversed: done}
      }
      // reopening goes through reopen_period, which evaluates this port's decisions
      fn reopen(reason) {
        #{reopen: "use reopen_period", reason: reason}
      }

      // the automatic close checks of the period (FIN-PC-004): each with its result and the
      // evidence of what fails
      fn checklist() {
        sys.read.get(#{target: self_id});
        let start = this.start;
        let end = this.end;
        let last = date_of(days(end) - 1);
        let yymm = last.sub_string(2, 2) + last.sub_string(5, 2);
        let checks = [];
        // 1. no unposted documents dated in the period
        let drafts = [];
        for cd in [["JournalEntry", "posting_date"], ["Invoice", "invoice_date"], ["Receipt", "receipt_date"],
                   ["Bill", "bill_date"], ["PaymentRun", "run_date"]] {
          let w = "this.state == \"draft\" and " + in_period(cd[1], start, end);
          for id in sys.search.query(#{query: #{from: cd[0], where: w}}).items {
            drafts.push(cd[0] + " " + sys.read.get(#{target: id}).fields.number);
          }
        }
        checks.push(check("unposted-documents", drafts));
        // 2. every bank account with statement lines in the period is reconciled for it
        let banks = [];
        for g in sys.read.projection(#{projection: "bank-lines", asof: last}).groups {
          let dt = g.values.date;
          if dt >= start && dt < end && !banks.contains(g.key.bank_account) { banks.push(g.key.bank_account); }
        }
        let unreconciled = [];
        for b in banks {
          let w = "this.bank_account == \"" + b + "\" and this.period_end == d'" + last + "' and (this.state == \"reconciled\" or this.state == \"signed_off\")";
          let rq = sys.search.query(#{query: #{from: "BankReconciliation", where: w}});
          let found = rq.items;
          if found.len() == 0 { unreconciled.push(b); }
        }
        checks.push(check("bank-reconciled", unreconciled));
        // 3. the subledgers equal their control accounts
        let differ = [];
        for cls in ["Receivables", "Payables"] {
          for id in sys.search.query(#{query: #{from: cls}}).items {
            let r = sys.run.port(#{target: id, port: "aging", params: #{as_of: last}});
            if r.difference != "0.00" { differ.push(cls + " " + r.difference); }
          }
        }
        checks.push(check("subledgers-agree", differ));
        // 4. the runs of the period: depreciation, revaluation and recurring entries
        let missing = [];
        let fw = "this.status == \"in_service\" and this.in_service < d'" + end + "'";
        let fq = sys.search.query(#{query: #{from: "FixedAsset", where: fw}});
        let fas = fq.items;
        if fas.len() > 0 {
          let dq = sys.search.query(#{query: #{from: "JournalEntry", where: "this.number == \"DEP-" + yymm + "\" and this.state == \"posted\""}});
          let dep = dq.items;
          if dep.len() == 0 { missing.push("DEP-" + yymm); }
        }
        for cls in ["Receivables", "Payables"] {
          for id in sys.search.query(#{query: #{from: cls}}).items {
            let r = sys.run.port(#{target: id, port: "revalue", params: #{period_end: last, simulate: true}});
            if r.items.len() > 0 && !("posted" in r) { missing.push(r.number); }
          }
        }
        let tw = "this.first_period_end <= d'" + last + "' and this.last_period_end >= d'" + last + "'";
        for id in sys.search.query(#{query: #{from: "RecurringEntry", where: tw}}).items {
          let n = sys.read.get(#{target: id}).fields.code + "-" + last.sub_string(0, 7);
          let eq = sys.search.query(#{query: #{from: "JournalEntry", where: "this.number == \"" + n + "\""}});
          let made = eq.items;
          if made.len() == 0 { missing.push(n); }
        }
        checks.push(check("runs-done", missing));
        // 5. the suspense accounts are at zero
        let open = [];
        let susp = [];
        for id in sys.search.query(#{query: #{from: "GlAccount", where: "this.suspense == true"}}).items {
          susp.push(sys.read.get(#{target: id}).fields.number);
        }
        if susp.len() > 0 {
          for x in sys.read.projection(#{projection: "gl-balance", asof: last}).groups {
            let p = x.key.account.split("/");
            let n = p[p.len() - 1];
            if susp.contains(n) {
              for m in x.values.balance { if !dec(m.amount).is_zero() && !open.contains(n) { open.push(n); } }
            }
          }
        }
        checks.push(check("suspense-zero", open));
        let passed = true;
        let failing = [];
        for c in checks { if !c.passed { passed = false; failing.push(c.check); } }
        #{period: start, last_day: last, passed: passed, failing: failing, checks: checks}
      }

      // a subledger closed for the period (FIN-PC-003)
      fn close_subledger(subledger) {
        sys.read.get(#{target: self_id});
        if this.state == "closed" { throw #{code: "LEDG.PERIOD_CLOSED", message: "the period is closed"}; }
        let list = if this.closed_subledgers == () { [] } else { this.closed_subledgers };
        if list.contains(subledger) { return #{closed: false, subledger: subledger}; }
        list.push(subledger);
        sys.commit.update(#{target: self_id, set: #{closed_subledgers: list}});
        #{closed: true, subledger: subledger, closed_subledgers: list}
      }

      // soft close: to closing when every check passes, keeping the results (FIN-PC-004, -005)
      fn soft_close() {
        sys.read.get(#{target: self_id});
        if this.state != "open" { throw #{code: "RULE.VALIDATION_FAILED", message: "the period is " + this.state}; }
        let r = sys.run.port(#{target: self_id, port: "checklist", params: #{}});
        if !r.passed {
          let names = "";
          for f in r.failing { names += if names == "" { f } else { ", " + f }; }
          throw #{code: "RULE.VALIDATION_FAILED", message: "the close checklist fails: " + names};
        }
        sys.commit.update(#{target: self_id, set: #{state: "closing", checklist: r.checks}});
        #{state: "closing", checks: r.checks}
      }
  - name: ubos.finance.years
    abi: "1.0"
    tier: l2
    profile: standard
    state: committed
    capabilities: [read, commit, run]
    exports: [close]
    source: |
      // close the year: every income and expense account to zero against retained earnings;
      // a later close (after adjustments) supersedes the earlier ones (FIN-PC-008)
      fn close() {
        sys.read.get(#{target: self_id});
        let groups = sys.read.projection(#{projection: "gl-balance", asof: this.last_day}).groups;
        let lines = [];
        let total = dec("0.00");
        let debits = dec("0.00");
        let currency = "USD";
        for g in groups {
          let cat = sys.read.get(#{target: g.key.account}).fields.category;
          if !(cat in ["Revenue", "Expense", "Other", "Tax"]) { continue; }
          let b = dec("0.00");
          for m in g.values.balance { b += dec(m.amount); currency = m.currency; }
          if b.is_zero() { continue; }
          lines.push(#{account: g.key.account, amount: #{amount: (-b).to_string(), currency: currency}});
          if b < 0 { debits -= b; }
          total += b;
        }
        let closes = if this.closes == () { [] } else { this.closes };
        if lines.is_empty() {
          sys.commit.update(#{target: self_id, set: #{state: "closed", closes: closes}});
          return #{closed: true, entry: ()};
        }
        lines.push(#{account: this.retained_earnings, amount: #{amount: total.to_string(), currency: currency}});
        if total > 0 { debits += total; }
        let number = "CLOSE-" + this.year + "-" + (closes.len() + 1).to_string();
        let c = sys.commit.create(#{class: "JournalEntry", slug: number.to_lower(),
          fields: #{number: number, source: "closing", kind: "closing", posting_date: this.last_day,
                    description: "Year-end close " + this.year, lines: lines,
                    total: #{amount: debits.to_string(), currency: currency}, state: "draft"}});
        sys.run.port(#{target: c.object_id, port: "post", params: #{}});
        let out = [];
        for x in closes { out.push(#{number: x.number, superseded: true}); }
        out.push(#{number: number, superseded: false});
        sys.commit.update(#{target: self_id, set: #{state: "closed", closes: out}});
        #{closed: true, entry: number}
      }
  - name: ubos.finance.recurring
    abi: "1.0"
    tier: l2
    profile: standard
    state: committed
    capabilities: [read, commit, search]
    exports: [run]
    source: |
      // the entry of the period, created once (FIN-GL-017); it is posted like any entry
      fn run(period_end) {
        sys.read.get(#{target: self_id});
        if period_end < this.first_period_end || (this.last_period_end != () && period_end > this.last_period_end) {
          return #{created: false, reason: "outside the template's periods"};
        }
        let number = this.code + "-" + period_end.sub_string(0, 7);
        let q = sys.search.query(#{query: #{from: "JournalEntry", where: "this.number == \"" + number + "\""}});
        if q.items.len() > 0 { return #{created: false, number: number}; }
        sys.commit.create(#{class: "JournalEntry", slug: number.to_lower(),
          fields: #{number: number, source: this.source, kind: "journal", posting_date: period_end,
                    description: this.description, lines: this.lines, total: this.total, state: "draft"}});
        #{created: true, number: number}
      }
