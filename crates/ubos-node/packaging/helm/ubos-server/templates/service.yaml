apiVersion: v1
kind: Service
metadata:
  name: {{ include "ubos.name" . }}
  labels: {{- include "ubos.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "ubos.labels" . | nindent 4 }}
  ports: [{name: http, port: {{ .Values.service.port }}, targetPort: http}]
