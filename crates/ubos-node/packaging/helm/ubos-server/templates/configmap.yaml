apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ubos.name" . }}
  labels: {{- include "ubos.labels" . | nindent 4 }}
data:
  ubos.toml: |
    version = 1
    [server]
    listen = "0.0.0.0:{{ .Values.service.port }}"
    preset = "server"
    tenant = {{ .Values.server.tenant | quote }}
    vae = {{ .Values.server.vae | quote }}
    [database]
    url = "file:/etc/ubos/keys/database.url"
    [keys]
    root_kek = "file:/etc/ubos/keys/root.key"
    {{- if .Values.backup.enabled }}
    [backup]
    dir = "/var/backups/ubos"
    key = "file:/etc/ubos/keys/backup.key"
    retention_days = {{ .Values.backup.retentionDays }}
    {{- end }}
    {{- with .Values.server.extraConfig }}
    {{- . | nindent 4 }}
    {{- end }}
