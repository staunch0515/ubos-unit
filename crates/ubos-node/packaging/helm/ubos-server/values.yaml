# Values of the ubos-server chart (DSN-NOD-601). PH-1 runs one replica: high availability
# with leader leases follows the Server HA edition.
image:
  repository: ubos-server
  tag: local
  pullPolicy: IfNotPresent

server:
  tenant: acme
  vae: acme
  # extra ubos.toml keys appended verbatim (see `ubos-server config-schema`)
  extraConfig: ""

# The Secret holding the keys and the connection string, created by the operator:
#   kubectl create secret generic ubos-keys --from-file=root.key --from-file=backup.key \
#     --from-literal=database.url='host=… user=ubos dbname=ubos password=…'
existingSecret: ubos-keys

backup:
  enabled: true
  # base backups, the WAL archive and restore points: mount storage from another failure domain
  persistence:
    size: 50Gi
    storageClass: ""
  retentionDays: 35
  schedule: "17 2 * * *"

service:
  type: ClusterIP
  port: 8080

resources:
  requests: {cpu: 500m, memory: 512Mi}
  limits: {memory: 2Gi}
